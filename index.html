<style>
/* Layout: fixed left sidebar + gray workspace of white cards; top nav bar + floating add button on phones. */
:root{
  --bg:#f3f5f8; --card:#ffffff; --soft:#f6f7fa; --topbar:#fafbfc; --line:#e3e7ee; --line2:#eef1f5;
  --ink:#1b2333; --sub:#5d6678; --mute:#8c95a6;
  --accent:#4a63c4; --accent-ink:#ffffff; --accent-soft:#eaeefb; --navy:#26365a; --navy-sub:#c3cbe0;
  --bar-in:#7d93d6; --bar-out:#c9d1de; --neg:#c0443c; --neg-soft:#fbeceb; --ok:#2f8a5b; --ok-soft:#e6f4ec;
  --warn:#a0701c; --warn-soft:#fbf1dd; --warn-line:#efe1c6; --overlay:rgba(20,28,45,.42);
  --font:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11151d; --card:#191f2a; --soft:#202836; --topbar:#151a23; --line:#2a3242; --line2:#222a37;
  --ink:#e6eaf2; --sub:#aab3c4; --mute:#7f899c; --accent:#8199f0; --accent-ink:#0f1420; --accent-soft:#252f4b; --navy:#2a3a63; --navy-sub:#b8c3e0;
  --bar-in:#8199f0; --bar-out:#4a5468; --neg:#f08a80; --neg-soft:#3a2224; --ok:#5cc28c; --ok-soft:#1d3427;
  --warn:#e0b45a; --warn-soft:#2e2717; --warn-line:#4a3d1f; --overlay:rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151d; --card:#191f2a; --soft:#202836; --topbar:#151a23; --line:#2a3242; --line2:#222a37;
  --ink:#e6eaf2; --sub:#aab3c4; --mute:#7f899c; --accent:#8199f0; --accent-ink:#0f1420; --accent-soft:#252f4b; --navy:#2a3a63; --navy-sub:#b8c3e0;
  --bar-in:#8199f0; --bar-out:#4a5468; --neg:#f08a80; --neg-soft:#3a2224; --ok:#5cc28c; --ok-soft:#1d3427;
  --warn:#e0b45a; --warn-soft:#2e2717; --warn-line:#4a3d1f; --overlay:rgba(0,0,0,.55); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink);margin:0}
body{font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,td.r,.amt{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

.app{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:100vh}
.side{background:var(--card);border-right:1px solid var(--line);padding:22px 12px;display:flex;flex-direction:column;gap:24px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand-ic{width:34px;height:34px;border-radius:9px;background:var(--navy);display:grid;place-items:center;flex:none;color:#fff}
.brand b{font-size:17px;font-weight:800;display:block;line-height:1.1;white-space:nowrap}
.brand small{font-size:7.5px;letter-spacing:.18em;color:var(--mute);font-weight:500}
.nav-h{font-size:11px;color:var(--mute);padding:0 10px;margin-bottom:6px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:10px;border-radius:8px;color:var(--sub);font-size:13.5px;text-align:left;white-space:nowrap}
.nav button svg{flex:none;color:var(--mute)}
.nav button:hover{background:var(--bg)}
.nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.nav button.on svg{color:var(--accent)}
.nav button.on::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent);margin-left:auto}
.side-foot{margin-top:auto;font-size:12px;color:var(--sub);display:flex;flex-direction:column;gap:10px;padding:0 8px}
.side-foot .lock{display:flex;gap:6px;align-items:center}
.side-foot p{margin:0;font-size:11px;color:var(--mute);line-height:1.5}

.top{height:58px;border-bottom:1px solid var(--line);background:var(--topbar);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-left:24px;padding-right:24px;font-size:12px;color:var(--sub)}
.top-r{display:flex;align-items:center;gap:14px}
.icon-btn{border:0;background:none;padding:6px;border-radius:6px;color:var(--sub);display:grid;place-items:center}
.icon-btn:hover{background:var(--line2)}
main{padding-block:28px 40px;padding-left:24px;padding-right:24px;max-width:1180px;width:100%}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.eyebrow{font-size:11.5px;color:var(--accent);font-weight:700}
h1{font-size:26px;font-weight:800;margin:4px 0 6px;letter-spacing:-.01em;text-wrap:balance}
.ph p{margin:0;color:var(--sub);font-size:12.5px}
.ph-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mpick{display:flex;align-items:center;border:1px solid var(--line);background:var(--card);border-radius:8px;height:38px;padding:0 4px}
.mpick button{border:0;background:none;width:30px;height:30px;border-radius:6px;display:grid;place-items:center;color:var(--sub)}
.mpick button:hover{background:var(--bg)}
.mpick span{font-size:13px;min-width:96px;text-align:center;font-weight:500}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;height:38px;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--mute)}
.btn:disabled{opacity:.55;cursor:default}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.pri:hover{filter:brightness(.94)}
.btn.sm{height:32px;padding:0 10px;font-size:12px}
.btn.danger{color:var(--neg)}
.btn.danger.armed{background:var(--neg);color:#fff;border-color:var(--neg)}
.link{border:0;background:none;color:var(--accent);font-size:12px;font-weight:600;padding:2px 0;display:inline-flex;align-items:center;gap:2px}
.link:hover{text-decoration:underline}
.link.mute{color:var(--sub);font-weight:500}
.link.danger{color:var(--neg)}

.stats{display:grid;gap:12px;margin-bottom:18px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 16px;min-width:0}
.stat .k{font-size:11.5px;color:var(--sub)}
.stat .v{font-size:21px;font-weight:800;margin:6px 0 4px;letter-spacing:-.01em;overflow-wrap:anywhere}
.stat .s{font-size:11px;color:var(--mute)}
.stat.dark{background:var(--navy);border-color:var(--navy);color:#fff}
.stat.dark .k,.stat.dark .s{color:var(--navy-sub)}
.stat.dark .v.neg{color:#ffb7b0}
.delta{font-size:10.5px;font-weight:700;margin-left:4px}
.delta.up{color:var(--neg)} .delta.down{color:var(--ok)} .delta.inc{color:var(--ok)} .delta.dec{color:var(--neg)}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card-h h2{font-size:15px;font-weight:800;margin:0}
.card-h .aside{font-size:11px;color:var(--mute)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:14px}
.banner{border:1px solid var(--warn-line);background:var(--warn-soft);color:var(--warn);font-size:12px;padding:10px 14px;border-radius:8px;margin-bottom:12px}
.empty-st{padding:40px 10px;text-align:center;color:var(--mute);font-size:12.5px}
.note{font-size:11.5px;color:var(--mute);margin:12px 0 0}

.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--soft);color:var(--mute);font-weight:500;font-size:11.5px;text-align:left;padding:10px 12px;white-space:nowrap}
td{padding:13px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
td.r,th.r{text-align:right}
td .t{font-weight:600}
td .d{font-size:11px;color:var(--mute);margin-top:2px;max-width:340px}
.neg{color:var(--neg)} .pos{color:var(--accent)}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:5px;background:var(--line2);color:var(--sub);white-space:nowrap}
.pill.blue{background:var(--accent-soft);color:var(--accent)}
.pill.green{background:var(--ok-soft);color:var(--ok)}
.pill.red{background:var(--neg-soft);color:var(--neg)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.tag{display:inline-block;font-size:10.5px;color:var(--accent);margin-right:4px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none;vertical-align:middle}
.acts{display:flex;gap:10px;justify-content:flex-end;white-space:nowrap;align-items:center}

.chart-legend{display:flex;gap:14px;font-size:11px;color:var(--sub);align-items:center;justify-content:space-between;margin-bottom:6px}
.chart-legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle}
.chart svg{width:100%;height:auto;max-height:230px;display:block}
.chart text{fill:var(--mute);font-size:10px;font-family:var(--font)}

.donut-wrap{display:grid;grid-template-columns:150px minmax(0,1fr);gap:18px;align-items:center}
.donut svg{width:150px;height:150px;display:block}
.donut text{fill:var(--ink);font-family:var(--font)}
.legend{display:flex;flex-direction:column;gap:8px;font-size:12.5px;min-width:0}
.legend div{display:grid;grid-template-columns:12px minmax(0,1fr) auto auto;gap:8px;align-items:center}
.legend span:nth-child(2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend .pct{color:var(--mute);font-size:11px;min-width:34px;text-align:right}

.bgroup{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:20px;margin-bottom:14px;border-top:3px solid var(--gc,var(--navy))}
.bg-sum{background:var(--soft);border-radius:8px;display:grid;grid-template-columns:1fr 1fr;padding:12px 14px;margin:12px 0 4px;font-size:12px;color:var(--sub)}
.bg-sum b{display:block;font-size:14px;color:var(--ink)}
.bitems{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:28px}
.bitem{padding:16px 0;border-bottom:1px solid var(--line2);min-width:0}
.bitem-h{display:flex;justify-content:space-between;gap:8px}
.bitem-h b{font-size:13px}
.bitem-h small{display:block;font-size:10.5px;color:var(--mute)}
.bitem-n{display:grid;grid-template-columns:1fr 1fr;margin-top:8px;font-size:11px;color:var(--mute)}
.bitem-n b{display:block;color:var(--ink);font-size:13px}
.bar{height:5px;border-radius:3px;background:var(--line2);margin:10px 0 4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.bar.warn i{background:var(--warn)}
.bar.over i{background:var(--neg)}
.bitem-f{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;color:var(--mute);gap:8px}
.bitem-f .acts{gap:12px}

.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));margin-top:16px;border-top:1px solid var(--line2);padding-top:14px;gap:10px 0}
.split>div{padding:0 12px;border-left:1px solid var(--line2);font-size:11.5px;color:var(--sub)}
.split>div:first-child{border-left:0;padding-left:0}
.split b{display:block;color:var(--ink);font-size:14px;margin:2px 0}
.split small{font-size:10.5px;color:var(--mute)}
.alerts{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.allow{display:flex;justify-content:space-between;align-items:center;background:var(--soft);border-radius:8px;padding:10px 12px;margin-top:12px;font-size:12px;color:var(--sub)}
.allow b{font-size:15px;color:var(--ink)}
.minirow{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line2);gap:10px}
.minirow small{display:block;font-size:10.5px;color:var(--mute)}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--sub)}
.chip b{font-size:20px;color:var(--ink)}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{flex:1 1 220px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;height:38px;padding:0 12px;background:var(--card);min-width:0;color:var(--mute)}
.search input{border:0;outline:0;background:none;flex:1;min-width:0;font-size:13px;color:var(--ink)}
select.sel{height:38px;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:0 10px;font-size:12.5px;max-width:100%}
.check{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--sub)}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:6px 12px;border-radius:7px;font-size:12.5px;color:var(--sub)}
.tabs button.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.tabs .cnt{font-size:10.5px;background:var(--line2);border-radius:4px;padding:1px 6px;margin-left:5px;color:var(--sub)}
.sec-h{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;margin:22px 0 10px}
.acc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.acc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.acc-top{display:flex;gap:14px;align-items:center;min-width:0}
.logo{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;font-weight:800;font-size:15px;flex:none;color:#fff}
.acc-top b{font-size:15px;display:block}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:3px}
.memo{background:var(--soft);border-radius:8px;padding:10px 12px;font-size:12px;color:var(--sub);display:flex;gap:12px}
.memo span:first-child{color:var(--mute);flex:none}
.acc-f{border-top:1px solid var(--line2);padding-top:10px;display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--mute);margin-top:auto;gap:8px}
.acc-f .bal{font-size:15px;color:var(--ink);font-weight:800}

.result{border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:16px 18px;margin:14px 0 20px}
.result-h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--mute)}
.result-h b{font-size:14px;color:var(--ink)}
.result-n{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-top:12px;font-size:11.5px;color:var(--sub)}
.result-n b{display:block;font-size:14px;color:var(--ink)}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:14px 4px 6px;border-bottom:1px solid var(--line);font-size:12px;color:var(--sub);flex-wrap:wrap}
.dayhead b{color:var(--ink);font-size:13px}
.dayhead .sums{display:flex;gap:10px;font-size:11.5px}
.txrow{display:grid;grid-template-columns:14px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line2)}
.txrow .t{font-weight:600;font-size:13px;overflow-wrap:anywhere}
.txrow .d{font-size:11px;color:var(--mute);overflow-wrap:anywhere}
.txrow .amt{font-weight:700;text-align:right;white-space:nowrap}
.pager{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:11px;color:var(--mute);gap:10px;flex-wrap:wrap}
.pager .pg{display:flex;align-items:center;gap:8px}
.pager button{width:28px;height:28px;border:1px solid var(--line);background:var(--card);border-radius:6px}
.pager button:disabled{opacity:.4;cursor:default}
.filter-chip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);border:0;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600}

.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:6px}
.cal .wd{font-size:11px;color:var(--mute);text-align:center;padding:4px 0}
.cal .wd.sun{color:var(--neg)}
.cday{border:1px solid var(--line2);background:var(--card);border-radius:8px;min-height:72px;padding:6px;text-align:left;display:flex;flex-direction:column;gap:2px;font-size:11px;min-width:0;position:relative;overflow:hidden}
.cday .n{font-weight:700;color:var(--sub);font-size:11.5px}
.cday.today .n{color:var(--accent)}
.cday .o{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;position:relative}
.cday .i{color:var(--accent);font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;position:relative}
.cday .heat{position:absolute;inset:0;background:var(--neg);pointer-events:none}
.cday.blank{border:0;background:none}
.cday:not(.blank):hover{border-color:var(--accent)}

.set-sec{margin-bottom:16px}
.catrow{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 2px;border-bottom:1px solid var(--line2)}
.catrow .nm{font-weight:600;font-size:13px}
.catrow .sb{font-size:11px;color:var(--mute);overflow-wrap:anywhere}
.ord{border:1px solid var(--line);background:var(--card);border-radius:6px;width:28px;height:28px;display:grid;place-items:center;color:var(--sub)}
.ord:disabled{opacity:.35;cursor:default}
.grp-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:18px 0 4px;flex-wrap:wrap}
.grp-h b{font-size:14px}
.optrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.optrow .lbl b{display:block;font-size:13px}
.optrow .lbl small{font-size:11.5px;color:var(--mute)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{flex:1;border:0;background:var(--card);padding:8px 12px;font-size:12.5px;color:var(--sub);border-left:1px solid var(--line);white-space:nowrap}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
.menu-checks{display:flex;flex-wrap:wrap;gap:8px 16px}

.ov{position:fixed;inset:0;background:var(--overlay);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--card);border-radius:14px;width:min(480px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:22px;border:1px solid var(--line)}
.modal h3{margin:0 0 16px;font-size:17px;font-weight:800}

<script>
/* 은은하게 흐르는 그라데이션 배경 (라이브러리 없이 WebGL 1). 탭이 숨겨지면 멈추고, 동작 줄이기 설정이면 한 장만 그림. */
(function(){
  var cv=document.getElementById("fx-bg"), root=document.documentElement, gl;

  "vec2 q=vec2(fb(p+vec2(0.,t*.05)),fb(p+vec2(5.2,1.3)-t*.04));"+
  "vec2 w=vec2(fb(p+2.2*q+vec2(1.7,9.2)+t*.03),fb(p+2.2*q+vec2(8.3,2.8)-t*.035));"+
  "float a=fb(p+2.*w);vec3 col=c0;"+
  "col=mix(col,c1,smoothstep(.25,.85,a));col=mix(col,c2,smoothstep(.35,.95,w.x)*.85);col=mix(col,c3,smoothstep(.4,1.,q.y)*.7);"+
  "col=mix(col,c0,smoothstep(.55,1.15,uv.y)*.35);"+
  "col+=(h(gl_FragCoord.xy+fract(t))-.5)/255.*2.;gl_FragColor=vec4(col,1.);}";

  var v=sh(gl.VERTEX_SHADER,vs), f=sh(gl.FRAGMENT_SHADER,fs); if(!v||!f) return;

let recurringRunning=false;
async function runRecurring(){
  if(recurringRunning||!api) return; recurringRunning=true;
  const cur=ymOf(today); let made=0;
  try{
    for(const f of S.fixed.slice()){
      if(f.active===false || !f.auto) continue;
      let m = f.last_month ? shiftYm(f.last_month,1) : (f.start_month || cur); let last=null, guard=0;
      while(m<=cur && guard++<24){
        const ds=`${m}-${pad(Math.min(f.day||1,lastDay(m)))}`; if(ds>todayStr) break;
        try{ await api.add("tx",{type:f.type||"expense",unit:"day",date:ds,month:m,amount:f.amount,category:f.category||"",sub:f.sub||"",title:f.name,method:accName(f.account_id),memo:"반복 거래 자동 기록",tags:f.tags||[],account_id:f.account_id||null,to_account_id:f.to_account_id||null,recurring_id:f.id},true); made++; }
        catch(e){ if(!/duplicate|unique/i.test(e.message||"")) throw e; }
        last=m; m=shiftYm(m,1);
      }
      if(last) await api.put("fixed",f.id,{...f,last_month:last});
    }
    if(made) toast(`반복 거래 ${made}건을 자동으로 기록했어요`);
  }catch(e){ console.error(e); }
  recurringRunning=false;
}

function periodChart(yms,opts={}){

  const n=yms.length, W=m?(n<=6?340:400):720, H=m?190:200, fs=m?11:10, top=22, bot=26, left=6, right=6, ch=H-top-bot, gw=(W-left-right)/n;
  const label = ym => { const mm=+ym.slice(5); return m&&n>6 ? String(mm) : `${mm}월`; };
  let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="월별 수입과 소비 지출">`;
  [0,.5,1].forEach(f=>{ const yy=top+ch*(1-f); svg+=`<line x1="${left}" x2="${W-right}" y1="${yy}" y2="${yy}" stroke="var(--line2)"/>`; });
  svg+=`<text x="${W-right}" y="12" text-anchor="end" font-size="${fs}">${max>1?won(max):""}</text>`;
  rows.forEach((r,i)=>{ const x0=left+gw*i+gw/2, bw=Math.min(m?14:12,gw*.28), hi=r.income/max*ch, he=r.expense/max*ch, cur=yms[i]===S.month;
    if(r.income) svg+=`<rect x="${x0-bw-1.5}" y="${top+ch-hi}" width="${bw}" height="${hi}" rx="1.5" fill="var(--bar-in)"><title>${label(yms[i])} 수입 ${won(r.income,1)}</title></rect>`;
    if(r.expense) svg+=`<rect x="${x0+1.5}" y="${top+ch-he}" width="${bw}" height="${he}" rx="1.5" fill="var(--bar-out)"><title>${label(yms[i])} 소비 지출 ${won(r.expense,1)}</title></rect>`;
    if(!r.income&&!r.expense) svg+=`<line x1="${x0-bw}" x2="${x0+bw}" y1="${top+ch}" y2="${top+ch}" stroke="var(--line)" stroke-dasharray="2 2"/>`;
    svg+=`<text x="${x0}" y="${H-7}" text-anchor="middle" font-size="${fs}" ${cur?'style="fill:var(--accent);font-weight:700"':""}>${label(yms[i])}</text>`; });
  return `<div class="chart"><div class="chart-legend"><span><i style="background:var(--bar-in)"></i>수입 <i style="background:var(--bar-out);margin-left:10px"></i>소비 지출</span><span style="color:var(--mute)">${opts.note||"기록된 금액 기준"}</span></div>${svg}</div>`;
}

/* ---- 가계부 ---- */
function sortTx(mode){
  const key=t=>(t.date||(t.month+"-00"))+String(t.created_at||t.createdAt||"");
  if(mode==="date-asc") return (a,b)=>key(a)<key(b)?-1:1;
  if(mode==="amt-desc") return (a,b)=>(b.amount||0)-(a.amount||0);
  if(mode==="amt-asc") return (a,b)=>(a.amount||0)-(b.amount||0);
  return (a,b)=>key(a)<key(b)?1:-1;
}
function filteredTx(){
  const f=S.tf, q=f.q.trim().toLowerCase();
  const base = f.all ? S.tx : txIn(S.month);
  return base.filter(t=>(f.type==="all"||t.type===f.type)&&(!f.cat||t.category===f.cat)&&(!f.tag||(t.tags||[]).includes(f.tag))&&(!f.acc||t.account_id===f.acc||t.to_account_id===f.acc)&&(!f.day||t.date===f.day)&&
    (!q||[t.title,t.memo,t.category,t.sub,accName(t.account_id),accName(t.to_account_id),(t.tags||[]).join(" ")].join(" ").toLowerCase().includes(q))).sort(sortTx(f.sort));
}
const txSign = t => t.type==="income"?"+":t.type==="transfer"?"":"−";
function txRow(t){
  const accTxt = t.type==="transfer"||((t.type==="saving"||t.type==="invest")&&t.to_account_id) ? [accName(t.account_id),accName(t.to_account_id)].filter(Boolean).join(" → ") : accName(t.account_id)||t.method;
  return `<div class="txrow"><span class="dot" style="background:${colorOf(t.type,t.category)}"></span>
  <div style="min-width:0"><div class="t">${esc(t.title||t.category||TYPES[t.type])}</div><div class="d">${esc([TYPES[t.type],t.category+(t.sub?" › "+t.sub:""),accTxt].filter(Boolean).join(" · "))}${t.memo?" · "+esc(t.memo):""}${S.view!=="tx"||S.tf.sort.startsWith("amt")||S.tf.all?` · ${t.unit==="month"?esc(t.month)+" 합계":esc(t.date)}`:""}</div>${(t.tags||[]).length?`<div>${t.tags.map(g=>`<span class="tag">#${esc(g)}</span>`).join("")}</div>`:""}</div>
  <span class="amt num ${t.type==="income"?"pos":""}">${txSign(t)}${won(t.amount)}</span>
  <div class="acts"><button class="link" data-copy-tx="${esc(t.id)}" title="같은 내용으로 새로 기록">복사</button><button class="link" data-edit-tx="${esc(t.id)}">수정</button></div></div>`;
}
function catOptionsFor(type){
  if(type==="income") return incomeCats().map(c=>c.name);
  if(type==="expense") return expenseCats().map(c=>c.name);
  if(type==="saving") return plansSorted().filter(p=>p.type==="저축").map(p=>p.name);
  if(type==="invest") return plansSorted().filter(p=>p.type==="투자").map(p=>p.name);
  if(type==="transfer") return TRANSFER_CATS;
  return [...new Set([...incomeCats().map(c=>c.name),...expenseCats().map(c=>c.name),...S.plans.map(p=>p.name)])];
}
const allTags = () => [...new Set(S.tx.flatMap(t=>t.tags||[]))].sort((a,b)=>a.localeCompare(b,"ko"));
function txListHtml(list){
  const f=S.tf; if(!list.length) return `<div class="empty-st">선택한 조건에 해당하는 거래가 없습니다.</div>`;
  if(f.sort.startsWith("amt")) return list.map(txRow).join("");
  const groupsMap=new Map(); list.forEach(t=>{ const k=t.unit==="month"?"m:"+t.month:t.date; if(!groupsMap.has(k)) groupsMap.set(k,[]); groupsMap.get(k).push(t); });
  return [...groupsMap.entries()].map(([k,items])=>{
    let label; if(k.startsWith("m:")) label=`${shortLabel(k.slice(2))} 월 합계`; else { const d=new Date(k+"T00:00:00"); label=`${d.getMonth()+1}월 ${d.getDate()}일 (${WD[d.getDay()]})${f.all?` · ${d.getFullYear()}`:""}`; }

    return `<div class="dayhead"><b>${label}</b><span class="sums num">${inc?`<span class="pos">+${won(inc)}</span>`:""}${out?`<span>−${won(out)}</span>`:""}</span></div>${items.map(txRow).join("")}`;

  const alloc=sum(expenseCats(),c=>budgetFor(c.name,ym))+sum(plans,p=>p.target);
  const total=+s.totalBudget||0;
  const item=(name,sub,b,used,kind,key,isO,color)=>{ const pct=b?used/b*100:(used?100:0); const bs=kind==="plan"?"":budgetState(used,b);
    return `<div class="bitem"><div class="bitem-h"><div><b><span class="dot" style="background:${color};margin-right:6px"></span>${esc(name)}</b><small>${esc(sub)}${kind==="cat"?(isO?" · 이번 달만":" · 기본 예산"):""}</small></div><b class="num">${won(b)}</b></div>

    <div class="bar ${bs}"><i style="width:${Math.min(100,pct)}%"></i></div>
    <div class="bitem-f"><span class="num">${pct>=1000?"999%+":Math.round(pct)+"%"}${bs==="over"?' <span class="pill red">초과</span>':bs==="warn"?' <span class="pill warn">주의</span>':""}</span><div class="acts"><button class="link" data-bedit="${esc(key)}" data-bkind="${kind}">수정</button>${kind==="cat"?`<button class="link" data-bonce="${esc(key)}">이번 달만</button>`:""}</div></div></div>`; };

  <div class="stats">${stat("월 기준 예산",won(total),"한 달 전체 예산")}${stat("배분 합계",won(alloc),"소비 예산 + 저축·투자 목표")}${stat("미배분 금액",won(total-alloc),"기준 예산 − 배분 합계",true,total-alloc<0?"neg":"")}</div>

}

/* ---- 저축·투자 ---- */
function saveHtml(){
  const ym=S.month, plans=plansSorted();

  const sv=plans.filter(p=>p.type==="저축"), iv=plans.filter(p=>p.type==="투자"), t=totals(ym);
  const list=txIn(ym).filter(x=>x.type==="saving"||x.type==="invest").sort(sortTx("date-desc"));
  const goals=plans.filter(p=>+p.goal>0);
  const goalRow=p=>{ const saved=planSaved(p), g=+p.goal, pct=Math.min(100,saved/g*100); let info="";
    if(saved>=g) info=`<span class="pill green">달성했어요</span>`;
    else if(p.goal_date){ const end=new Date(p.goal_date+"T00:00:00"); const months=Math.max(0,(end.getFullYear()-today.getFullYear())*12+end.getMonth()-today.getMonth()); const days=Math.ceil((end-new Date(todayStr+"T00:00:00"))/864e5);

  <div class="stats">${stat("저축 목표",won(sum(sv,p=>p.target)),"적금·청약·비상금 등")}${stat("실제 저축 납입",orNone(t.saving),"저축 거래 합계")}${stat("투자 목표",won(sum(iv,p=>p.target)),"펀드·ETF·주식 등")}${stat("실제 투자 납입",orNone(t.invest),"투자 거래 합계",true)}</div>
  ${goals.length?`<section class="card" style="margin-bottom:14px"><div class="card-h"><h2>목표 저축</h2><span class="aside">지금까지 넣은 금액 기준</span></div>${goals.map(goalRow).join("")}</section>`:""}
  <section class="card" style="margin-bottom:14px"><div class="card-h"><h2>월 납입 계획</h2><button class="link" data-open="plan">항목 추가</button></div>
    <p class="note" style="margin:-6px 0 10px">납입 기록을 추가해야 실제 금액에 반영돼요. 매달 같은 금액이면 ‘고정·반복’에 자동 기록으로 등록해 두세요. ‘수정’에서 목표 금액과 날짜를 정하면 목표 저축으로 관리돼요.</p>

    ${plans.map(p=>{ const paid=paidBy[p.name]||0, tg=+p.target||0; const status=!paid?["미입력",""]:paid>=tg&&tg>0?["완료","green"]:["진행 중","blue"];

    </tbody></table></div>`:`<div class="empty-st">적금, 청약, ETF처럼 매달 넣는 항목을 추가해 보세요.<br><button class="link" data-open="plan">저축·투자 항목 추가</button></div>`}

/* ---- 고정·반복 ---- */
function fixedHtml(){
  const ym=ymOf(today), list=S.fixed.slice().sort((a,b)=>((a.active===false)-(b.active===false))||(a.day||99)-(b.day||99));
  const act=S.fixed.filter(f=>f.active!==false);
  const due=f=>f.day?`${ym}-${pad(Math.min(f.day,lastDay(ym)))}`:"";
  const done=f=>S.tx.some(t=>t.recurring_id===f.id&&t.month===ym);
  const upcoming=act.filter(f=>f.day&&due(f)>=todayStr&&!done(f)).sort((a,b)=>a.day-b.day)[0];
  const sec=(title,items)=>items.length?`<div class="sec-h" style="margin-top:6px">${title} <span class="pill">${items.length}개</span></div><div class="tbl-wrap"><table class="rt"><thead><tr><th>항목</th><th>분류</th><th>계좌</th><th>매월</th><th class="r">금액</th><th>기록 방식</th><th>이번 달</th><th></th></tr></thead><tbody>
    ${items.map(f=>`<tr style="${f.active===false?"opacity:.55":""}"><td class="first"><div class="t">${esc(f.name)}</div>${f.memo||(f.tags||[]).length?`<div class="d">${esc(f.memo||"")} ${(f.tags||[]).map(g=>`<span class="tag">#${esc(g)}</span>`).join("")}</div>`:""}</td>
    <td data-l="분류">${esc((f.category||"")+(f.sub?" › "+f.sub:""))}</td><td data-l="계좌">${esc([accName(f.account_id),accName(f.to_account_id)].filter(Boolean).join(" → "))}</td><td class="num" data-l="매월">${f.day?f.day+"일":"미정"}</td><td class="r num" data-l="금액">${won(f.amount)}</td>
    <td data-l="기록 방식">${f.active===false?'<span class="pill">중지</span>':f.auto?'<span class="pill blue">자동</span>':'<span class="pill">직접</span>'}</td>
    <td data-l="이번 달">${f.active===false?"":done(f)?'<span class="pill green">기록됨</span>':f.auto?`<span class="pill">${f.day?due(f).slice(5).replace("-","/")+" 예정":"예정"}</span>`:`<button class="link" data-paid="${esc(f.id)}">지금 기록</button>`}</td>
    <td class="acts-cell"><div class="acts"><button class="link" data-edit-fixed="${esc(f.id)}">수정</button></div></td></tr>`).join("")}</tbody></table></div>`:"";
  const ex=list.filter(f=>(f.type||"expense")==="expense"), inc=list.filter(f=>f.type==="income"), oth=list.filter(f=>["saving","invest","transfer"].includes(f.type));
  const manualLeft=act.filter(f=>!f.auto&&!done(f));
  return pageHead(`${today.getFullYear()}년 ${today.getMonth()+1}월`,"고정·반복","월세, 구독, 월급, 적금처럼 매달 반복되는 거래를 관리하세요.",`${manualLeft.length?`<button class="btn" id="paid-all">직접 기록 ${manualLeft.length}건 한 번에 기록</button>`:""}<button class="btn pri" data-open="fixed">${ic("plus",15)} 반복 거래 추가</button>`)+`
  <div class="stats">${stat("매달 고정 지출",won(sum(act.filter(f=>(f.type||"expense")==="expense"),f=>f.amount)),"사용 중인 지출 항목 합계")}${stat("정기 수입",won(sum(act.filter(f=>f.type==="income"),f=>f.amount)),"월급·용돈 등")}${stat("저축·투자·이체",won(sum(act.filter(f=>["saving","invest","transfer"].includes(f.type)),f=>f.amount)),"매달 옮기는 돈")}${stat("다음 예정",upcoming?won(upcoming.amount):"없음",upcoming?`${esc(upcoming.name)} · ${due(upcoming).slice(5).replace("-","/")}`:"이번 달 남은 예정 없음",true)}</div>
  <section class="card">
    ${list.length?sec("지출",ex)+sec("수입",inc)+sec("저축·투자·이체",oth)+`<p class="note">‘자동’은 매달 그날이 되면 사이트를 열 때 가계부에 자동으로 기록돼요. ‘직접’은 결제를 확인한 뒤 ‘지금 기록’을 눌러 주세요.</p>`

/* ---- 연간 결산 ---- */
function yearHtml(){

  const rows=[...Array(12)].map((_,i)=>{ const ym=`${y}-${pad(i+1)}`, t=txIn(ym), r=totals(ym); const u=new Set(t.map(x=>x.unit)); r.unit=!t.length?"기록 없음":u.size>1?"월 합계·일별 기록":u.has("month")?"월 합계":"일별 기록"; return r; });
  const inc=sum(rows,r=>r.income), exp=sum(rows,r=>r.expense), sv=sum(rows,r=>r.saving+r.invest), months=rows.filter(r=>r.count).length;
  const catY={}; S.tx.filter(t=>t.type==="expense"&&periodOf(t).startsWith(y+"-")).forEach(t=>catY[t.category]=(catY[t.category]||0)+(+t.amount||0));
  const topC=Object.entries(catY).sort((a,b)=>b[1]-a[1]).slice(0,8), cmax=topC.length?topC[0][1]:1;

  <div class="stats">${stat("기록된 수입",won(inc),`${y}년 · ${months}개월 기록`)}${stat("소비 지출",won(exp),months?`월평균 ${won(exp/months)}`:"기록 없음")}${stat("저축·투자",won(sv),"납입 합계")}${stat("수입 − 소비 지출",won(inc-exp),"기록된 수입·지출 기준",true,inc-exp<0?"neg":"")}</div>
  <section class="card" style="margin-bottom:14px"><div class="card-h"><h2>${y}년 월별 내역</h2></div>${yearChart(y)}
  <div class="tbl-wrap" style="margin-top:8px"><table class="rt"><thead><tr><th>월</th><th class="r">수입</th><th class="r">소비 지출</th><th class="r">저축·투자</th><th class="r">수입 − 지출</th><th>기록 단위</th></tr></thead><tbody>
  ${rows.map((r,i)=>r.count||!isMobile()?`<tr><td class="first"><b>${i+1}월</b></td><td class="r num" data-l="수입">${r.count?won(r.income):"–"}</td><td class="r num" data-l="소비 지출">${r.count?won(r.expense):"–"}</td><td class="r num" data-l="저축·투자">${r.count?won(r.saving+r.invest):"–"}</td><td class="r num ${r.income-r.expense<0?"neg":""}" data-l="수입 − 지출">${r.count?won(r.income-r.expense):"–"}</td><td data-l="기록 단위">${r.unit}</td></tr>`:"").join("")}${isMobile()&&!months?`<tr><td class="first" style="border:0;color:var(--mute)">기록된 달이 없어요.</td></tr>`:""}
  </tbody></table></div><p class="note">저축·투자·이체는 소비 지출에 포함하지 않아요.${startDay()!==1?` 한 달은 매월 ${startDay()}일부터 계산해요.`:""}</p></section>

function openModal(kind,id,preset={}){
  let d;
  if(kind==="tx"){ const t=id&&S.tx.find(x=>x.id===id); const nowDate=S.month===curPeriod()?todayStr:periodRange(S.month)[0].toISOString&&dateStr(periodRange(S.month)[0]);
    d = t?{...t,tags:(t.tags||[]).join(" ")}:{type:preset.type||"expense",unit:"day",date:nowDate,month:S.month,amount:preset.amount||"",category:preset.category||"",sub:preset.sub||"",title:preset.title||"",account_id:preset.account_id||"",to_account_id:preset.to_account_id||"",tags:preset.tags||"",memo:"",recurring_id:preset.recurring_id||null}; }
  if(kind==="acc"){ const a=id&&S.accounts.find(x=>x.id===id); d = a?{...a,balance:accBalance(a)??0,_orig:accBalance(a)}:{kind:preset.kind==="대출"?"대출":"계좌",name:"",institution:"",purpose:preset.kind==="대출"?"신용대출":"입출금",balance:"",link:"",memo:""}; }
  if(kind==="fixed"){ const f=id&&S.fixed.find(x=>x.id===id); d = f?{...f,type:f.type||"expense",tags:(f.tags||[]).join(" "),auto:f.auto?"1":"0",active:f.active===false?"0":"1"}:{name:"",type:"expense",category:"",sub:"",day:"",amount:"",account_id:"",to_account_id:"",auto:"1",active:"1",tags:"",memo:""}; }
  if(kind==="plan"){ const p=id&&S.plans.find(x=>x.id===id); d = p?{...p,goal:p.goal||"",saved_base:p.saved_base||"",goal_date:p.goal_date||""}:{name:"",type:"저축",target:"",memo:"",goal:"",goal_date:"",saved_base:""}; }
  if(kind==="import") d={step:1}; if(kind==="restore") d={};
  if(kind==="cat"){ const ck=preset.kind||"expense"; if(id){ const c=(ck==="expense"?expenseCats():incomeCats()).find(c=>c.name===id); d={...c,ckind:ck,subs:(c.subs||[]).join(", "),amount:ck==="expense"?(st().baseBudget[c.name]||0):0,_old:c.name}; } else d={ckind:ck,name:"",group:preset.group||groups()[0].id,color:PALETTE[(ck==="expense"?expenseCats():incomeCats()).length%PALETTE.length],subs:"",amount:""}; }
  if(kind==="group"){ const g=id&&groups().find(g=>g.id===id); d = g?{...g}:{name:""}; }
  if(kind==="budget"){ d={name:id,amount:st().baseBudget[id]||0}; }
  if(kind==="once"){ d={name:id,amount:budgetFor(id,S.month)}; }
  if(kind==="total"){ d={amount:st().totalBudget||0}; }
  if(kind==="pw"||kind==="bye"||kind==="convert"||kind==="guestout") d={};
  M={kind,id,d,err:"",armed:false}; render();
  if(!isMobile()) setTimeout(()=>{ const el=document.querySelector(".modal input:not([type=hidden]):not([type=color]),.modal select"); if(el&&!(document.activeElement&&document.activeElement.closest&&document.activeElement.closest(".modal"))) el.focus(); },0);
}
const fld=(label,inner,hint="")=>`<div class="f"><label>${label}</label>${inner}${hint?`<small>${hint}</small>`:""}</div>`;
const inp=(k,v,attrs="")=>`<input id="m-${k}" data-k="${k}" value="${esc(v??"")}" ${attrs}>`;
const amtInp=(k,v)=>inp(k, v===""||v==null?"":hasOp(v)?String(v):parseAmt(v).toLocaleString("ko-KR"), 'inputmode="numeric" placeholder="0" data-amt="1" autocomplete="off"');
const sel=(k,v,opts)=>`<select id="m-${k}" data-k="${k}">${opts.map(o=>{ const [val,l]=Array.isArray(o)?o:[o,o]; return `<option value="${esc(val)}" ${String(v??"")===String(val)?"selected":""}>${esc(l)}</option>`; }).join("")}</select>`;
const accOpts=(filter)=>[["","선택 안 함"],...S.accounts.filter(filter||(()=>true)).map(a=>[a.id,a.name+(a.kind==="카드"?" (카드)":a.kind==="대출"?" (대출)":"")])];
function recentTemplates(){ const seen=new Set(), out=[]; for(const t of S.tx.slice().sort(sortTx("date-desc"))){ const k=t.type+"|"+t.category+"|"+t.title; if(seen.has(k)) continue; seen.add(k); out.push(t); if(out.length>=6) break; } return out; }
function txFields(d,isFixed){
  const cats=catOptionsFor(d.type); if(d.category&&!cats.includes(d.category)) cats.unshift(d.category);
  const cat=catOf(d.type,d.category); const subs=cat&&cat.subs&&cat.subs.length?cat.subs:null;
  const noPlan=(d.type==="saving"||d.type==="invest")&&!cats.length;
  let acc="";
  if(d.type==="income") acc=fld("입금 계좌",sel("account_id",d.account_id,accOpts(isAsset)));
  else if(d.type==="expense"){ const ca=accById(d.account_id); const canInst=!isFixed&&!M.id&&d.unit!=="month"&&ca&&ca.kind==="카드";
    acc=`<div class="${canInst?"row2":""}">${fld("결제수단·계좌",sel("account_id",d.account_id,accOpts(a=>a.kind!=="대출")))}${canInst?fld("할부",sel("inst",d.inst||"1",[["1","일시불"],...[...Array(23)].map((_,i)=>[i+2,(i+2)+"개월"])])):""}</div>${canInst&&+d.inst>1?`<p class="note" style="margin:-6px 0 12px">${d.inst}개월로 나눠 매달 같은 날짜에 기록돼요. 이번 달은 ${won(parseAmt(d.amount)-Math.floor(parseAmt(d.amount)/d.inst)*(d.inst-1))}, 이후 ${won(Math.floor(parseAmt(d.amount)/d.inst))}씩.</p>`:""}`; }
  else if(d.type==="transfer") acc=`<div class="row2">${fld("보내는 계좌",sel("account_id",d.account_id,accOpts(isAsset)))}${fld("받는 계좌·카드·대출",sel("to_account_id",d.to_account_id,accOpts()))}</div>`;
  else acc=`<div class="row2">${fld("출금 계좌",sel("account_id",d.account_id,accOpts(isAsset)))}${fld("넣는 계좌 (선택)",sel("to_account_id",d.to_account_id,accOpts(isAsset)))}</div>`;
  return `<div class="f"><label>유형</label><div class="seg">${Object.entries(TYPES).map(([k,l])=>`<button type="button" data-mtype="${k}" class="${d.type===k?"on":""}">${l}</button>`).join("")}</div></div>
  ${isFixed?"":`<div class="row2">${fld("기록 단위",sel("unit",d.unit,[["day","일별 기록"],["month","월 합계"]]))}${d.unit==="month"?fld("월",inp("month",d.month,'type="month"')):fld("날짜",inp("date",d.date,'type="date"'))}</div>`}
  ${fld("금액 (원)",amtInp("amount",d.amount)+`<div class="calc">${["+","−","×","÷"].map(o=>`<button type="button" data-calc="${o}" aria-label="${o}">${o}</button>`).join("")}<span style="font-size:11px;color:var(--mute);align-self:center;margin-left:4px">12000+3500처럼 계산돼요</span></div>`)}
  ${noPlan?`<p class="note" style="margin:0 0 12px">저축·투자 항목이 아직 없어요. ‘저축·투자’ 메뉴에서 항목을 먼저 추가해 주세요.</p>`:`<div class="${subs?"row2":""}">${fld("카테고리",sel("category",d.category,[["","선택하세요"],...cats]))}${subs?fld("세부 항목",sel("sub",d.sub,[["","선택 안 함"],...subs])):""}</div>`}
  ${fld(isFixed?"항목 이름":"내용",inp(isFixed?"name":"title",isFixed?d.name:d.title,`placeholder="${isFixed?"예: 월세, 음악 구독, 월급":"예: 점심, 월급"}" maxlength="${isFixed?40:80}"`))}
  ${acc}
  ${fld("태그",inp("tags",d.tags,'placeholder="#여행 #회사" maxlength="120"'),"띄어쓰기로 구분, 최대 5개")}`;
}

function lineChart(labels,series,opts={}){
  const m=isMobile()||opts.compact, n=labels.length, W=m?360:720, H=opts.H||(m?200:220), fs=m?11:10, top=24, bot=26, left=6, right=m?48:56, ch=H-top-bot;
  const vals=series.flatMap(s=>s.vals.filter(v=>v!=null&&isFinite(v)));
  const max=Math.max(opts.min0===false?-Infinity:1,...vals,opts.max||0), min=Math.min(0,...vals);
  const fmt=opts.fmt||(v=>wonShort(v));
  const x=i=>left+(n<=1?0:(W-left-right)*i/(n-1)), y=v=>top+ch*(1-(v-min)/((max-min)||1));
  let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label||"추이 그래프")}">`;
  [0,.5,1].forEach(f=>{ const v=min+(max-min)*f, yy=y(v); svg+=`<line x1="${left}" x2="${W-right}" y1="${yy}" y2="${yy}" stroke="var(--line2)"/><text x="${W-right+4}" y="${yy+3}" font-size="${fs}">${esc(fmt(v))}</text>`; });
  if(min<0) svg+=`<line x1="${left}" x2="${W-right}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)"/>`;
  series.forEach(s=>{
    const pts=s.vals.map((v,i)=>v==null||!isFinite(v)?null:[x(i),y(v)]); let d="", started=false, lastPt=null, firstPt=null;
    pts.forEach(pt=>{ if(!pt){ started=false; return; } d+=(started?"L":"M")+pt[0].toFixed(1)+" "+pt[1].toFixed(1)+" "; started=true; lastPt=pt; if(!firstPt) firstPt=pt; });
    if(!d) return;
    if(s.fill&&firstPt&&min>=0) svg+=`<path d="${d}L${lastPt[0].toFixed(1)} ${y(Math.max(min,0)).toFixed(1)} L${firstPt[0].toFixed(1)} ${y(Math.max(min,0)).toFixed(1)} Z" fill="${s.color}" opacity=".12"/>`;
    svg+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.width||2}" ${s.dash?'stroke-dasharray="5 4"':""} stroke-linejoin="round" stroke-linecap="round"/>`;
    if(s.dots) pts.forEach((pt,i)=>{ if(pt) svg+=`<circle cx="${pt[0]}" cy="${pt[1]}" r="3" fill="${s.color}"><title>${esc(labels[i])} ${esc(fmt(s.vals[i]))}</title></circle>`; });
    if(s.end&&lastPt) svg+=`<circle cx="${lastPt[0]}" cy="${lastPt[1]}" r="4.5" fill="${s.color}" stroke="var(--card)" stroke-width="2"/>`;
  });
  const step=Math.ceil(n/(m?6:12));
  labels.forEach((l,i)=>{ if(i%step===0||i===n-1) svg+=`<text x="${x(i)}" y="${H-7}" text-anchor="middle" font-size="${fs}">${esc(l)}</text>`; });
  svg+=`</svg>`;
  const legend=series.filter(s=>s.name).map(s=>`<span><i style="background:${s.color}${s.dash?";opacity:.6":""}"></i>${esc(s.name)}</span>`).join(" ");
  return `<div class="chart"><div class="chart-legend"><span style="display:flex;gap:12px;flex-wrap:wrap">${legend}</span><span style="color:var(--mute)">${esc(opts.note||"")}</span></div>${svg}</div>`;
}
function barChart(yms,vals,color,opts={}){

  const max=Math.max(1,...vals), withVals=vals.filter(v=>v>0), avg=withVals.length?sum(withVals)/withVals.length:0;
  let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label||"월별 막대 그래프")}">`;

  if((m=s.match(/^(\d{4})\s*[-./년]\s*(\d{1,2})\s*월?$/))&&+m[2]>=1&&+m[2]<=12) return {month:`${m[1]}-${pad(+m[2])}`};

}
function okDate(y,mo,d){ if(y<1990||y>2100||mo<1||mo>12||d<1||d>31) return null; const dt=new Date(y,mo-1,d); if(dt.getMonth()!==mo-1) return null; return {date:dateStr(dt)}; }
function inferType(v){ const s=String(v||""); if(/수입|입금|income|들어/i.test(s)) return "income"; if(/저축/.test(s)) return "saving"; if(/투자/.test(s)) return "invest"; if(/이체|transfer/i.test(s)) return "transfer"; if(/지출|출금|expense|사용|결제|승인/i.test(s)) return "expense"; return null; }
function buildImportRows(d){
  const rows=d.table.slice(d.headIdx+1), mp=d.map, cell=(r,k)=>mp[k]!==""&&mp[k]!=null?r[+mp[k]]:"";
  const nums=r=>{ const v=cell(r,"amount"); return typeof v==="number"?v:evalAmt(String(v).replace(/[^\d.\-+]/g,"")); };
  const anyNeg=mp.amount!==""&&rows.some(r=>nums(r)<0);
  const out=[], bad=[];
  rows.slice(0,5000).forEach((r,i)=>{
    const dt=parseDateCell(cell(r,"date")); let type=mp.type!==""?inferType(cell(r,"type")):null; let amt;
    if(mp.inAmt!==""||mp.outAmt!==""){ const a=parseAmt(String(cell(r,"inAmt")).replace(/[^\d.]/g,"")), b=parseAmt(String(cell(r,"outAmt")).replace(/[^\d.]/g,"")); if(a>0){ amt=a; type=type||"income"; } else { amt=b; type=type||"expense"; } }
    else { const n=nums(r); amt=Math.abs(Math.round(n||0)); if(!type) type=n<0?"expense":anyNeg?"income":"expense"; }
    if(!dt||!amt){ bad.push(i+d.headIdx+2); return; }
    const monthUnit=!!dt.month||/월\s*합계/.test(String(cell(r,"unit")));
    const date=dt.date||null, month=dt.month||date.slice(0,7);
    const accN=String(cell(r,"account")||"").trim(), acc=S.accounts.find(a=>a.name===accN);
    out.push({type,unit:monthUnit?"month":"day",date:monthUnit?null:date,month:monthUnit?(dt.month||date.slice(0,7)):month,amount:amt,category:String(cell(r,"category")||"").trim().slice(0,40)||(type==="income"?"기타":type==="transfer"?"기타 이체":"기타"),sub:String(cell(r,"sub")||"").trim().slice(0,40),title:String(cell(r,"title")||"").trim().slice(0,80),method:accN.slice(0,40),memo:String(cell(r,"memo")||"").trim().slice(0,200),tags:parseTags(cell(r,"tags")),account_id:acc?acc.id:null,to_account_id:null,recurring_id:null});
  });
  return {out,bad};
}

    let table;

    else { const buf=await file.arrayBuffer(); let text=new TextDecoder("utf-8").decode(buf); if(text.includes("�")){ try{ text=new TextDecoder("euc-kr").decode(buf); }catch(e){} } table=parseCSV(text); }

  on("[data-akind]","onclick",b=>{ S.af.kind=b.dataset.akind; render(); });
  const ys=$("#ysel"); if(ys) ys.onchange=()=>{ S.year=+ys.value; render(); };
  // 설정
  on("[data-settab]","onclick",b=>{ S.setTab=b.dataset.settab; render(); });
  on("[data-cedit]","onclick",b=>{ const [k,n]=b.dataset.cedit.split("|"); openModal("cat",n,{kind:k}); });
  on("[data-gedit]","onclick",b=>openModal("group",b.dataset.gedit));
  on("[data-cmove]","onclick",b=>{ const [k,n,dir]=b.dataset.cmove.split("|"); const s=clone(st()); if(k==="expense"){ const c=s.expenseCats.find(c=>c.name===n); const same=s.expenseCats.filter(x=>x.group===c.group); const i=same.indexOf(c), j=i+(+dir); if(j<0||j>=same.length) return; const a=s.expenseCats.indexOf(same[i]), bb=s.expenseCats.indexOf(same[j]); [s.expenseCats[a],s.expenseCats[bb]]=[s.expenseCats[bb],s.expenseCats[a]]; } else { const i=s.incomeCats.findIndex(c=>c.name===n); s.incomeCats=moveIn(s.incomeCats,i,+dir); } api.saveSettings(s); });
  on("[data-gmove]","onclick",b=>{ const [g,dir]=b.dataset.gmove.split("|"); const s=clone(st()); s.groups=moveIn(s.groups,s.groups.findIndex(x=>x.id===g),+dir); api.saveSettings(s); });
  on("[data-pref]","onclick",b=>{ const s=clone(st()); const k=b.dataset.pref, v=b.dataset.val; s.prefs[k]= k==="short"?v==="1": k==="font"?+v : v; api.saveSettings(s); });
  const ps=$("#pref-start"); if(ps) ps.onchange=()=>{ const s=clone(st()); s.prefs.monthStart=+ps.value; S.settings=s; S.month=curPeriod(); api.saveSettings(s); toast(`한 달을 매월 ${ps.value}일부터 계산해요`); };
  on("[data-menu]","onchange",el=>{ const s=clone(st()); const set=new Set(s.prefs.hidden); if(el.checked) set.delete(el.dataset.menu); else set.add(el.dataset.menu); s.prefs.hidden=[...set]; api.saveSettings(s); });
  // CSV
  const c1=$("#csv-tx"); if(c1) c1.onclick=()=>saveCsv(`가계부_${S.tf.all?"전체":S.month}.csv`,TX_HEAD,txCsvRows(filteredTx()));
  const c2=$("#csv-acc"); if(c2) c2.onclick=()=>saveCsv("계좌카드.csv",["종류","이름","금융기관","용도","잔액","메모"],S.accounts.map(a=>[a.kind,a.name,a.institution,a.purpose,a.kind==="카드"?"":accBalance(a),a.memo]));
  const c3=$("#csv-save"); if(c3) c3.onclick=()=>saveCsv(`저축투자_${S.month}.csv`,TX_HEAD,txCsvRows(txIn(S.month).filter(x=>x.type==="saving"||x.type==="invest")));
  const c4=$("#csv-all"); if(c4) c4.onclick=()=>saveCsv("가계부_전체.csv",TX_HEAD,txCsvRows(S.tx.slice().sort(sortTx("date-asc"))));
  // 모달
  if(M){
    const f=$("#mform");
    f.onsubmit=e=>{ e.preventDefault(); saveModal(); };
    f.addEventListener("focusout",e=>{ const el=e.target; if(el.dataset&&el.dataset.amt&&hasOp(el.value)){ const n=evalAmt(el.value); if(isFinite(n)&&n>=0) el.value=Math.round(n).toLocaleString("ko-KR"); } });
    $$("#mform [data-calc]").forEach(b=>b.onclick=()=>{ const el=$("#m-amount"); if(!el) return; const op={"+":"+","−":"-","×":"*","÷":"/"}[b.dataset.calc]; el.value=el.value.replace(/[+\-*/]$/,"")+op; el.focus(); try{ el.setSelectionRange(el.value.length,el.value.length);}catch(_){} });
    $$("#mform [data-fav-fill]").forEach(b=>b.onclick=()=>{ const f=(prefs().favorites||[])[+b.dataset.favFill]; if(!f) return; readModal(); Object.assign(M.d,{type:f.type,category:f.category,sub:f.sub||"",title:f.title,amount:f.amount,account_id:accById(f.account_id)?f.account_id:"",to_account_id:accById(f.to_account_id)?f.to_account_id:"",tags:(f.tags||[]).join(" ")}); M.skipRead=true; render(); });
    const di=$("#mdel-inst"); if(di) di.onclick=deleteInst;
    const mf=$("#m-file"); if(mf) mf.onchange=()=>{ if(mf.files&&mf.files[0]) (M.kind==="import"?loadImportFile:loadRestoreFile)(mf.files[0]); };
    $$("#mform [data-imap]").forEach(el=>el.addEventListener("change",()=>{ readModal(); M.skipRead=true; render(); }));
    f.addEventListener("input",e=>{ const el=e.target; if(el.dataset&&el.dataset.amt&&!hasOp(el.value)){ const digits=el.value.replace(/[^\d]/g,""); const pos=el.value.length-el.selectionStart; el.value=digits?Number(digits).toLocaleString("ko-KR"):""; const p=Math.max(0,el.value.length-pos); try{ el.setSelectionRange(p,p);}catch(_){} } if(M.armed){ M.armed=false; const b=$("#mdel"); if(b){ b.classList.remove("armed"); b.textContent="삭제"; } } });
    $$("#mform [data-mtype]").forEach(b=>b.onclick=()=>{ readModal(); M.d.type=b.dataset.mtype; M.d.category=""; M.d.sub=""; M.skipRead=true; render(); });
    $$("#mform [data-mkind]").forEach(b=>b.onclick=()=>{ readModal(); M.d.kind=b.dataset.mkind; M.d.purpose=ACC_PURPOSE[M.d.kind][0]; M.skipRead=true; render(); });
    $$("#mform [data-recent]").forEach(b=>b.onclick=()=>{ const t=S.tx.find(x=>x.id===b.dataset.recent); if(!t) return; readModal(); Object.assign(M.d,{type:t.type,category:t.category,sub:t.sub||"",title:t.title,amount:t.amount,account_id:t.account_id||"",to_account_id:t.to_account_id||"",tags:(t.tags||[]).join(" ")}); M.skipRead=true; render(); });
    ["#m-unit","#m-category","#m-account_id","#m-inst"].forEach(k=>{ const el=$(k); if(el) el.addEventListener("change",()=>{ readModal(); if(k==="#m-category") M.d.sub=""; if(k==="#m-account_id") M.d.inst="1"; M.skipRead=true; render(); }); });
    $("#mcancel").onclick=()=>{ M=null; render(); };
    const del=$("#mdel"); if(del) del.onclick=deleteModal;
    const tc=$("#to-convert"); if(tc) tc.onclick=()=>openModal("convert");
    const orr=$("#once-reset"); if(orr) orr.onclick=async()=>{ const s=clone(st()); if(s.monthBudget[S.month]) delete s.monthBudget[S.month][M.d.name]; M=null; await api.saveSettings(s); toast("기본 예산으로 되돌렸어요"); };
    $("#ov").onclick=e=>{ if(e.target.id==="ov"){ M=null; render(); } };
  }
}
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&(M||S.more)){ M=null; S.more=false; render(); } });
let lastMobile=null;
window.addEventListener("resize",()=>{ const m=isMobile(); if(lastMobile!==null&&m!==lastMobile&&(S.mode==="db"||S.mode==="demo")) render(); lastMobile=m; });
let installEvt=null;
const isStandalone=()=>window.matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
window.addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); installEvt=e; if(S.view==="set") render(); });
if("serviceWorker" in navigator && location.protocol==="https:") window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));

/* =================== 로그인 화면 =================== */
function gateHtml(){
  const A=S.auth, t=A.tab;
  const brand=`<div class="brand" style="padding:0;margin-bottom:20px"><div class="brand-ic">${ic("acc",18)}</div><div><b>가계부</b><small style="display:block">PERSONAL FINANCE</small></div></div>`;
  const msg=`${A.err?`<p class="err" role="alert" style="margin:4px 0 0">${esc(A.err)}</p>`:""}${A.msg?`<p role="status" style="color:var(--accent);font-size:12.5px;margin:4px 0 0">${esc(A.msg)}</p>`:""}`;
  let form="";
  if(t==="newpw"){
    form=`<h1>새 비밀번호 설정</h1><p>앞으로 로그인할 때 쓸 비밀번호를 입력하세요.</p>
    <form id="authform" style="margin-top:16px">${fld("새 비밀번호 (8자 이상)",'<input id="a-pw" type="password" autocomplete="new-password" required minlength="8">')}${fld("비밀번호 확인",'<input id="a-pw2" type="password" autocomplete="new-password" required minlength="8">')}${msg}
    <div class="btns"><button class="btn pri" type="submit" ${A.busy?"disabled":""}>비밀번호 저장</button></div></form>`;
  } else if(t==="reset"){
    form=`<h1>비밀번호 찾기</h1><p>가입한 이메일로 비밀번호 재설정 링크를 보내드려요.</p>
    <form id="authform" style="margin-top:16px">${fld("이메일",`<input id="a-email" type="email" autocomplete="email" required value="${esc(A.email||"")}">`)}${msg}
    <div class="btns"><button class="btn pri" type="submit" ${A.busy?"disabled":""}>재설정 링크 보내기</button><button class="btn" type="button" data-atab="login">로그인으로 돌아가기</button></div></form>`;
  } else {
    const su=t==="signup";
    form=`<div class="seg" style="margin-bottom:18px"><button type="button" data-atab="login" class="${!su?"on":""}">로그인</button><button type="button" data-atab="signup" class="${su?"on":""}">회원가입</button></div>
    <h1>${su?"가계부 시작하기":"다시 오셨네요"}</h1><p>${su?"가입하면 기본 카테고리가 담긴 빈 가계부가 만들어져요. 카테고리는 전부 내 방식대로 바꿀 수 있고, 내 기록은 나만 볼 수 있어요.":"이메일과 비밀번호로 로그인하세요."}</p>
    <form id="authform" style="margin-top:16px">${fld("이메일",`<input id="a-email" type="email" autocomplete="email" required value="${esc(A.email||"")}">`)}
    ${fld(su?"비밀번호 (8자 이상)":"비밀번호",`<input id="a-pw" type="password" autocomplete="${su?"new-password":"current-password"}" required ${su?'minlength="8"':""}>`)}
    ${su?fld("비밀번호 확인",'<input id="a-pw2" type="password" autocomplete="new-password" required minlength="8">'):""}${msg}
    <div class="btns"><button class="btn pri" type="submit" ${A.busy?"disabled":""}>${A.busy?"잠시만요…":su?"가입하기":"로그인"}</button>
    ${su?"":`<button class="link" type="button" data-atab="reset" style="align-self:center">비밀번호를 잊었어요</button>`}</div></form>`;
  }
  return `<div class="gate"><div class="gate-box">${brand}${form}
  <div style="border-top:1px solid var(--line2);margin-top:20px;padding-top:16px;display:flex;flex-direction:column;gap:10px"><button class="btn" id="guest" type="button" style="width:100%" ${A.busy?"disabled":""}>비회원으로 시작하기</button><span style="font-size:11.5px;color:var(--mute);line-height:1.5">가입 없이 바로 써요. 기록은 이 기기·브라우저에서만 다시 열 수 있고, 나중에 이메일을 등록해 회원으로 전환할 수 있어요. 계좌번호·카드번호는 입력받지 않아요.</span></div></div></div>`;
}
const AUTH_ERR = m => /anonymous/i.test(m)?"지금은 비회원 이용이 꺼져 있어요. 회원가입으로 시작해 주세요.":/Invalid login credentials/i.test(m)?"이메일 또는 비밀번호가 맞지 않아요.":/Email not confirmed/i.test(m)?"메일함에서 인증 링크를 먼저 눌러주세요.":/already (been )?registered|already exists|email_exists/i.test(m)?"이미 가입된 이메일이에요. 다른 이메일을 쓰거나 로그인해 주세요.":/rate limit|too many/i.test(m)?"요청이 너무 많아요. 잠시 후 다시 시도해 주세요.":/should be different|same/i.test(m)?"지금 비밀번호와 다른 비밀번호를 입력해 주세요.":/password/i.test(m)?"비밀번호 조건을 확인해 주세요. (8자 이상)":/email/i.test(m)?"이메일 주소를 확인해 주세요.":"처리하지 못했어요. 잠시 후 다시 시도해 주세요.";
function bindGate(){
  const g=$("#guest"); if(g) g.onclick=async()=>{ if(!sb) return; S.auth.err=""; S.auth.msg=""; S.auth.busy=true; render(); try{ const {error}=await sb.auth.signInAnonymously(); if(error) throw error; }catch(err){ S.auth.busy=false; S.auth.err=AUTH_ERR(err.message||""); render(); } };
  $$("[data-atab]").forEach(b=>b.onclick=()=>{ const em=$("#a-email"); S.auth={tab:b.dataset.atab,msg:"",err:"",email:em?em.value:S.auth.email}; render(); });
  const f=$("#authform"); if(!f) return;
  f.onsubmit=async e=>{
    e.preventDefault(); const A=S.auth; const email=(($("#a-email")||{}).value||"").trim(), pw=($("#a-pw")||{}).value, pw2=($("#a-pw2")||{}).value;
    A.email=email||A.email; A.err=""; A.msg="";
    if((A.tab==="signup"||A.tab==="newpw") && (pw||"").length<8){ A.err="비밀번호는 8자 이상이어야 해요."; render(); return; }
    if((A.tab==="signup"||A.tab==="newpw") && pw!==pw2){ A.err="비밀번호 확인이 일치하지 않아요."; render(); return; }
    if(!sb){ A.err="로그인 모듈을 불러오지 못했어요."; render(); return; }
    A.busy=true; render();
    try{
      const back=location.origin+location.pathname;
      if(A.tab==="login"){ const {error}=await sb.auth.signInWithPassword({email,password:pw}); if(error) throw error; }
      if(A.tab==="signup"){ const {data,error}=await sb.auth.signUp({email,password:pw,options:{emailRedirectTo:back}}); if(error) throw error;
        if(!data.session){ S.auth={tab:"login",email,msg:"인증 메일을 보냈어요. 메일의 링크를 누르면 가입이 끝나요. (스팸함도 확인해 주세요)",err:""}; render(); return; } }
      if(A.tab==="reset"){ const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:back}); if(error) throw error; S.auth={tab:"login",email,msg:"재설정 링크를 보냈어요. 메일을 확인해 주세요.",err:""}; render(); return; }
      if(A.tab==="newpw"){ const {data,error}=await sb.auth.updateUser({password:pw}); if(error) throw error; S.auth={tab:"login",msg:"",err:""}; startSession(data.user); return; }
      A.busy=false;
    }catch(err){ A.busy=false; A.err=AUTH_ERR(err.message||""); render(); }
  };
}

let toastT=null;
function toast(msg,label,fn){ let el=$(".toast"); if(!el){ el=document.createElement("div"); el.className="toast"; el.setAttribute("role","status"); document.body.appendChild(el);} el.textContent=""; const sp=document.createElement("span"); sp.textContent=msg; el.appendChild(sp);
  if(label&&fn){ const b=document.createElement("button"); b.className="toast-act"; b.type="button"; b.textContent=label; b.onclick=()=>{ el.remove(); fn(); }; el.appendChild(b); }
  clearTimeout(toastT); toastT=setTimeout(()=>el.remove(),label?5000:2600); }

if(location.hash==="#demo") startDemo(); else boot();
