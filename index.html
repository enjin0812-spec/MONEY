<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https://exrqsdngmzmhmyaupcxz.supabase.co wss://exrqsdngmzmhmyaupcxz.supabase.co; img-src 'self' data: blob:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>가계부</title>
<meta name="description" content="수입·지출, 예산, 저축·투자, 고정비를 관리하는 개인 가계부">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* Layout: fixed left sidebar + light gray workspace of white cards; collapses to a top nav bar on phones. Single light theme by choice (matches the original). */
:root{
  --bg:#f3f5f8; --card:#ffffff; --line:#e3e7ee; --line2:#eef1f5;
  --ink:#1b2333; --sub:#5d6678; --mute:#8c95a6;
  --accent:#4a63c4; --accent-soft:#eaeefb; --navy:#26365a;
  --bar-in:#7d93d6; --bar-out:#c9d1de; --neg:#c0443c; --ok:#2f8a5b;
  --warn-bg:#fbf3e6; --warn-ink:#8a6a2e;
  --font:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,td.r,.amt{font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:100vh}
.side{background:var(--card);border-right:1px solid var(--line);padding:22px 12px;display:flex;flex-direction:column;gap:24px;position:sticky;top:0;height:100vh;padding-left:max(12px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand-ic{width:34px;height:34px;border-radius:9px;background:var(--navy);display:grid;place-items:center;flex:none}
.brand b{font-size:17px;font-weight:800;display:block;line-height:1.1}
.brand small{font-size:7.5px;letter-spacing:.18em;color:var(--mute);font-weight:500}
.nav-h{font-size:11px;color:var(--mute);padding:0 10px;margin-bottom:6px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:10px 10px;border-radius:8px;color:var(--sub);font-size:13.5px;text-align:left;white-space:nowrap}
.nav button svg{flex:none;color:var(--mute)}
.nav button:hover{background:var(--bg)}
.nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.nav button.on svg{color:var(--accent)}
.nav button.on::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent);margin-left:auto}
.side-foot{margin-top:auto;font-size:12px;color:var(--sub);display:flex;flex-direction:column;gap:10px;padding:0 8px}
.side-foot .lock{display:flex;gap:6px;align-items:center}
.who{display:flex;gap:8px;align-items:center}
.who img{width:24px;height:24px;border-radius:50%}
.side-foot p{margin:0;font-size:11px;color:var(--mute);line-height:1.5}

.top{height:58px;border-bottom:1px solid var(--line);background:#fafbfc;display:flex;align-items:center;justify-content:space-between;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));font-size:12px;color:var(--sub)}
.top-r{display:flex;align-items:center;gap:14px}
.icon-btn{border:0;background:none;padding:6px;border-radius:6px;color:var(--sub);display:grid;place-items:center}
.icon-btn:hover{background:var(--line2)}
main{padding-block:28px 40px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));max-width:1180px;width:100%}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.eyebrow{font-size:11.5px;color:var(--accent);font-weight:700}
h1{font-size:26px;font-weight:800;margin:4px 0 6px;letter-spacing:-.01em}
.ph p{margin:0;color:var(--sub);font-size:12.5px}
.ph-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mpick{display:flex;align-items:center;border:1px solid var(--line);background:var(--card);border-radius:8px;height:38px;padding:0 4px}
.mpick button{border:0;background:none;width:30px;height:30px;border-radius:6px;display:grid;place-items:center}
.mpick button:hover{background:var(--bg)}
.mpick input{border:0;background:none;font-size:13px;width:140px;text-align:center}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;height:38px;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:500}
.btn:hover{border-color:#cfd5df}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.btn.pri:hover{background:#3f57b3}
.btn.sm{height:32px;padding:0 10px;font-size:12px}
.btn.danger{color:var(--neg)}
.btn.danger.armed{background:var(--neg);color:#fff;border-color:var(--neg)}
.link{border:0;background:none;color:var(--accent);font-size:12px;font-weight:600;padding:2px 0;display:inline-flex;align-items:center;gap:2px}
.link:hover{text-decoration:underline}

.stats{display:grid;gap:12px;margin-bottom:18px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 16px}
.stat .k{font-size:11.5px;color:var(--sub)}
.stat .v{font-size:21px;font-weight:800;margin:6px 0 4px;letter-spacing:-.01em}
.stat .s{font-size:11px;color:var(--mute)}
.stat.dark{background:var(--navy);border-color:var(--navy);color:#fff}
.stat.dark .k,.stat.dark .s{color:#c3cbe0}
.v.empty{color:var(--ink)}
.stat.dark .v.neg{color:#ffb7b0}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.card-h h2{font-size:15px;font-weight:800;margin:0}
.card-h .aside{font-size:11px;color:var(--mute)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:14px}
.stack{display:flex;flex-direction:column;gap:14px}
.banner{border:1px solid #efe1c6;background:var(--warn-bg);color:var(--warn-ink);font-size:12px;padding:10px 14px;border-radius:8px;margin-bottom:12px}
.empty-st{padding:46px 10px;text-align:center;color:var(--mute);font-size:12.5px}
.note{font-size:11.5px;color:var(--mute);margin:12px 0 0}

.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#f6f7fa;color:var(--mute);font-weight:500;font-size:11.5px;text-align:left;padding:10px 12px;white-space:nowrap}
td{padding:13px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
td.r,th.r{text-align:right}
td .t{font-weight:600}
td .d{font-size:11px;color:var(--mute);margin-top:2px;max-width:340px}
.neg{color:var(--neg)}
.pos{color:var(--accent)}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:5px;background:var(--line2);color:var(--sub);white-space:nowrap}
.pill.blue{background:var(--accent-soft);color:var(--accent)}
.pill.green{background:#e6f4ec;color:var(--ok)}
.pill.red{background:#fbeceb;color:var(--neg)}
.acts{display:flex;gap:10px;justify-content:flex-end;white-space:nowrap}

/* chart */
.chart-legend{display:flex;gap:14px;font-size:11px;color:var(--sub);align-items:center}
.chart-legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle}
.chart svg{width:100%;height:auto;max-height:230px;display:block}
.chart text{fill:var(--mute);font-size:10px;font-family:var(--font)}

/* budget */
.bgroup{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:20px;margin-bottom:14px;border-top:2px solid var(--navy)}
.bgroup.fixed{border-top-color:#b9a77d}
.bgroup.save{border-top-color:#6f8fb6}
.bg-sum{background:#f6f7fa;border-radius:8px;display:grid;grid-template-columns:1fr 1fr;padding:12px 14px;margin:12px 0 4px;font-size:12px;color:var(--sub)}
.bg-sum b{display:block;font-size:14px;color:var(--ink)}
.bitems{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:28px}
.bitem{padding:16px 0;border-bottom:1px solid var(--line2)}
.bitem-h{display:flex;justify-content:space-between;gap:8px}
.bitem-h b{font-size:13px}
.bitem-h small{display:block;font-size:10.5px;color:var(--mute)}
.bitem-n{display:grid;grid-template-columns:1fr 1fr;margin-top:8px;font-size:11px;color:var(--mute)}
.bitem-n b{display:block;color:var(--ink);font-size:13px}
.bar{height:5px;border-radius:3px;background:var(--line2);margin:10px 0 4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.bar.over i{background:var(--neg)}
.bitem-f{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;color:var(--mute)}
.bitem-f .acts{gap:12px}

/* home */
.split3{display:grid;grid-template-columns:repeat(3,1fr);margin-top:16px;border-top:1px solid var(--line2);padding-top:14px}
.split3>div{padding:0 12px;border-left:1px solid var(--line2);font-size:11.5px;color:var(--sub)}
.split3>div:first-child{border-left:0;padding-left:0}
.split3 b{display:block;color:var(--ink);font-size:14px;margin:2px 0}
.split3 small{font-size:10.5px;color:var(--mute)}
.catbars{display:flex;flex-direction:column;gap:12px}
.catbar{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;font-size:12.5px}
.catbar .bar{margin:0}
.catbar .amt{font-weight:600;font-size:12px}
.minirow{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line2);gap:10px}
.minirow small{display:block;font-size:10.5px;color:var(--mute)}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.chip{border:1px solid var(--line);background:#f6f7fa;border-radius:10px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--sub)}
.chip b{font-size:20px;color:var(--ink)}

/* accounts */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{flex:1 1 220px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;height:38px;padding:0 12px;background:var(--card);min-width:0}
.search input{border:0;outline:0;background:none;flex:1;min-width:0;font-size:13px}
select.sel{height:38px;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:0 10px;font-size:12.5px;max-width:100%}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:6px 12px;border-radius:7px;font-size:12.5px;color:var(--sub)}
.tabs button.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.tabs .cnt{font-size:10.5px;background:var(--line2);border-radius:4px;padding:1px 6px;margin-left:5px;color:var(--sub)}
.sec-h{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;margin:22px 0 10px}
.acc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.acc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px}
.acc-top{display:flex;gap:14px;align-items:center}
.logo{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;font-weight:800;font-size:15px;flex:none;color:#fff}
.acc-top b{font-size:15px;display:block}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:3px}
.memo{background:#f6f7fa;border-radius:8px;padding:10px 12px;font-size:12px;color:var(--sub);display:flex;gap:12px}
.memo span:first-child{color:var(--mute);flex:none}
.acc-f{border-top:1px solid var(--line2);padding-top:10px;display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--mute);margin-top:auto}
.acc-f .bal{font-size:14px;color:var(--ink);font-weight:700}

/* tx */
.result{border:1px solid var(--line);background:#f6f7fa;border-radius:10px;padding:16px 18px;margin:14px 0 20px}
.result-h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--mute)}
.result-h b{font-size:14px;color:var(--ink)}
.result-n{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-top:12px;font-size:11.5px;color:var(--sub)}
.result-n b{display:block;font-size:14px;color:var(--ink)}
.txrow{display:grid;grid-template-columns:86px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line2)}
.txrow .dt{font-size:11.5px;color:var(--mute)}
.txrow .t{font-weight:600;font-size:13px;overflow-wrap:anywhere}
.txrow .d{font-size:11px;color:var(--mute)}
.txrow .amt{font-weight:700;text-align:right;white-space:nowrap}
.pager{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:11px;color:var(--mute);gap:10px;flex-wrap:wrap}
.pager .pg{display:flex;align-items:center;gap:8px}
.pager button{width:28px;height:28px;border:1px solid var(--line);background:var(--card);border-radius:6px}
.pager button:disabled{opacity:.4;cursor:default}

/* modal */
.ov{position:fixed;inset:0;background:rgba(20,28,45,.42);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--card);border-radius:14px;width:min(460px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:22px}
.modal h3{margin:0 0 16px;font-size:17px;font-weight:800}
.f{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.f label{font-size:12px;color:var(--sub);font-weight:500}
.f input,.f select,.f textarea{border:1px solid var(--line);border-radius:8px;height:40px;padding:0 12px;background:var(--card);font-size:14px;width:100%}
.f textarea{height:70px;padding:10px 12px;resize:vertical}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--card);padding:9px 0;font-size:13px;color:var(--sub);border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--accent);color:#fff;font-weight:700}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.m-foot{display:flex;gap:8px;justify-content:space-between;margin-top:18px}
.m-foot .r{display:flex;gap:8px;margin-left:auto}
.err{color:var(--neg);font-size:12px;min-height:16px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;padding:10px 18px;border-radius:9px;font-size:13px;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.15)}

/* gate */
.gate{min-height:100vh;display:grid;place-items:center;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.gate-box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:32px 28px;max-width:420px;width:100%}
.gate-box h1{font-size:22px}
.gate-box p{color:var(--sub);font-size:13px;margin:8px 0}
.gate-box ul{padding-left:18px;color:var(--sub);font-size:12.5px;margin:14px 0}
.gate-box .btns{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.demo-flag{background:var(--warn-bg);color:var(--warn-ink);border-bottom:1px solid #efe1c6;font-size:12px;padding:8px 24px;text-align:center}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:auto;flex-direction:row;align-items:center;gap:10px;padding:10px 12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--card)}
  .brand small,.nav-h,.side-foot{display:none}
  .brand{padding:0}
  .nav{flex-direction:row}
  .nav button{padding:8px 10px}
  .nav button svg{display:none}
  .nav button.on::after{display:none}
  .top{height:46px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  main{padding-block:20px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .bitems{grid-template-columns:minmax(0,1fr)}
  h1{font-size:22px}
}
@media (max-width:520px){
  .stats{grid-template-columns:1fr 1fr}
  .stat .v{font-size:17px}
  .txrow{grid-template-columns:minmax(0,1fr) auto;row-gap:2px}
  .txrow .dt{grid-column:1/-1}
  .txrow .acts{grid-column:1/-1;justify-content:flex-start}
  .catbar{grid-template-columns:88px 1fr auto}
  .mpick input{width:118px}
  .ph-r{width:100%}
  .ph-r .btn.pri{margin-left:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="root"><div class="gate"><div class="gate-box"><p>가계부를 불러오는 중…</p></div></div></div>

<script src="supabase.js"></script>
<script>
"use strict";
/* ---------- defaults: category names only, every amount starts at 0 ---------- */
const DEFAULT_EXPENSE = [
  {name:"예비비",group:"변동비"},{name:"식비",group:"변동비"},{name:"생활·생필품",group:"변동비"},{name:"교통비",group:"변동비"},
  {name:"쇼핑·문화·취미",group:"자유자금"},{name:"자기계발·경조사",group:"자유자금"},{name:"의료·미용·의류·신발",group:"자유자금"},
  {name:"보험",group:"고정비"},{name:"통신비",group:"고정비"},{name:"구독비",group:"고정비"},{name:"데이트비",group:"고정비"}
];
const DEFAULT_INCOME = ["급여","부수입","리뷰비","이자·배당","용돈","기타수입"];
const DEFAULT_PLANS = [
  {id:"p1",name:"파킹/자유적금(비상금)",type:"저축"},{id:"p2",name:"주택청약",type:"저축"},{id:"p3",name:"장기적금",type:"저축"},
  {id:"p4",name:"NASDAQ",type:"투자"},{id:"p5",name:"S&P 500",type:"투자"}
];
const TYPES = {income:"수입",expense:"지출",saving:"저축",invest:"투자",transfer:"이체"};
const GROUPS = ["변동비","자유자금","고정비"];
const ACC_PURPOSE = {"계좌":["입출금","CMA","예적금","청약","간편결제","증권","기타"],"카드":["체크카드","신용카드","선불·상품권","기타"]};

function defaultSettings(){
  return {v:1, createdAt:new Date().toISOString(), expenseCats:DEFAULT_EXPENSE.map(c=>({...c})), incomeCats:DEFAULT_INCOME.slice(),
    baseBudget:{}, monthBudget:{}, totalBudget:0};
}

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function fromRow(col,r){ const o={...r}; if(col==="tx"){ o.createdAt=r.created_at; if(o.date) o.date=String(o.date).slice(0,10); } if(col==="plans") o.order=r.sort; ["amount","balance","target"].forEach(k=>{ if(o[k]!=null) o[k]=+o[k]; }); return o; }
function toRow(col,obj){ const src={...obj}; if(col==="plans") src.sort=obj.order??99; const r={}; COLS[col].forEach(k=>{ if(src[k]!==undefined) r[k]=src[k]; }); if(col!=="plans") r.updated_at=new Date().toISOString(); return r; }
const settingsFrom = r => ({expenseCats:r.expense_cats||[],incomeCats:r.income_cats||[],baseBudget:r.base_budget||{},monthBudget:r.month_budget||{},totalBudget:+r.total_budget||0});
const settingsTo = s => ({expense_cats:s.expenseCats||[],income_cats:s.incomeCats||[],base_budget:s.baseBudget||{},month_budget:s.monthBudget||{},total_budget:Math.max(0,+s.totalBudget||0),updated_at:new Date().toISOString()});

function makeSbApi(userId){
  const fail = e => { handleWriteError(e); throw e; };
  const upsertLocal = (col,row) => { const o=fromRow(col,row); const i=S[col].findIndex(x=>x.id===o.id); if(i>=0) S[col][i]=o; else S[col].push(o); render(); };
  let chain = Promise.resolve();
  return {
    async put(col,id,obj){ const {data,error}=await sb.from(TABLE[col]).update(toRow(col,obj)).eq("id",id).select().single(); if(error) fail(error); upsertLocal(col,data); },
    async add(col,obj){ const {data,error}=await sb.from(TABLE[col]).insert(toRow(col,obj)).select().single(); if(error) fail(error); upsertLocal(col,data); },
    async del(col,id){ const {error}=await sb.from(TABLE[col]).delete().eq("id",id); if(error) fail(error); S[col]=S[col].filter(x=>x.id!==id); render(); },
    saveSettings(s){ S.settings=s; render(); chain=chain.then(async()=>{ const {error}=await sb.from("settings").update(settingsTo(s)).eq("user_id",userId); if(error) handleWriteError(error); }); return chain; }
  };
}
function handleWriteError(e){
  console.error(e); const m=(e&&e.message)||"";
  if(/JWT|expired|session/i.test(m)) toast("로그인이 만료됐어요. 다시 로그인해 주세요.");
  else if(/check constraint|too long/i.test(m)) toast("입력값을 확인해 주세요. 글자 수가 너무 길 수 있어요.");
  else if(/duplicate|unique/i.test(m)) toast("같은 이름의 항목이 이미 있어요.");
  else toast("저장하지 못했어요. 네트워크를 확인하고 다시 시도해 주세요.");
}
async function fetchAll(table){
  let out=[], from=0;
  for(;;){ const {data,error}=await sb.from(table).select("*").order("created_at",{ascending:true}).range(from,from+999); if(error) throw error; out=out.concat(data); if(data.length<1000) break; from+=1000; }
  return out;
}

  if(!window.supabase){ S.mode="gate"; S.auth.err="로그인 모듈을 불러오지 못했어요. 새로고침해 주세요."; render(); return; }

function yearChart(y){
  const rows = [...Array(12)].map((_,i)=>monthTotals(`${y}-${pad(i+1)}`));
  const max = Math.max(1,...rows.map(r=>Math.max(r.income,r.expense)));
  const W=720,H=200,top=22,bot=24,left=8,right=8, ch=H-top-bot, gw=(W-left-right)/12;
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${y}년 월별 수입과 소비 지출">`;
  [0,.5,1].forEach(f=>{ const yy=top+ch*(1-f); svg+=`<line x1="${left}" x2="${W-right}" y1="${yy}" y2="${yy}" stroke="#eef1f5"/>`; });
  svg += `<text x="${W-right}" y="12" text-anchor="end">${max>1?won(max):""}</text>`;
  rows.forEach((r,i)=>{
    const x0 = left+gw*i+gw/2, bw=Math.min(12,gw*.25);
    const hi = r.income/max*ch, he = r.expense/max*ch;
    if(r.income) svg+=`<rect x="${x0-bw-2}" y="${top+ch-hi}" width="${bw}" height="${hi}" rx="1.5" fill="#7d93d6"><title>${i+1}월 수입 ${won(r.income)}</title></rect>`;
    if(r.expense) svg+=`<rect x="${x0+2}" y="${top+ch-he}" width="${bw}" height="${he}" rx="1.5" fill="#c9d1de"><title>${i+1}월 소비 지출 ${won(r.expense)}</title></rect>`;
    if(!r.income && !r.expense) svg+=`<line x1="${x0-bw}" x2="${x0+bw}" y1="${top+ch}" y2="${top+ch}" stroke="#d6dbe4" stroke-dasharray="2 2"/>`;
    svg+=`<text x="${x0}" y="${H-6}" text-anchor="middle">${i+1}월</text>`;
  });
  svg += `</svg>`;
  return `<div class="chart"><div class="chart-legend" style="justify-content:space-between;margin-bottom:6px"><span><i style="background:#7d93d6"></i>수입 <i style="background:#c9d1de;margin-left:10px"></i>소비 지출</span><span style="color:var(--mute)">기록된 금액 기준</span></div>${svg}</div>`;
}

/* ---- tx ---- */
function sortTx(mode){
  const key = t => (t.date || (t.month+"-00")) + (t.createdAt||"");
  if(mode==="date-asc") return (a,b)=>key(a)<key(b)?-1:1;
  if(mode==="amt-desc") return (a,b)=>(b.amount||0)-(a.amount||0);
  if(mode==="amt-asc") return (a,b)=>(a.amount||0)-(b.amount||0);
  return (a,b)=>key(a)<key(b)?1:-1;
}
function filteredTx(){
  const f=S.tf; const q=f.q.trim().toLowerCase();
  return txMonth(S.month).filter(t=>(f.type==="all"||t.type===f.type)&&(!f.cat||t.category===f.cat)&&(!f.unit||t.unit===f.unit)&&
    (!q||[t.title,t.memo,t.method,t.category].join(" ").toLowerCase().includes(q))).sort(sortTx(f.sort));
}
function txSign(t){ return t.type==="income"?"+":t.type==="transfer"?"":"−"; }
function txRow(t){
  return `<div class="txrow"><span class="dt num">${t.unit==="month"?ymLabel(t.month)+" 합계":esc(t.date)}</span>
  <div style="min-width:0"><div class="t">${esc(t.title||t.category||TYPES[t.type])}</div><div class="d">${esc([TYPES[t.type],t.category,t.method].filter(Boolean).join(" · "))}${t.memo?" · "+esc(t.memo):""}</div></div>
  <span class="amt num ${t.type==="income"?"pos":""}">${txSign(t)}${won(t.amount)}</span>
  <div class="acts"><button class="link" data-edit-tx="${esc(t.id)}">수정</button></div></div>`;
}
function catOptionsFor(type){
  if(type==="income") return st().incomeCats||[];
  if(type==="expense") return expenseCats().map(c=>c.name);
  if(type==="saving") return plansSorted().filter(p=>p.type==="저축").map(p=>p.name);
  if(type==="invest") return plansSorted().filter(p=>p.type==="투자").map(p=>p.name);
  if(type==="transfer") return ["계좌 간 이체","카드 대금"];
  return [...new Set([...(st().incomeCats||[]),...expenseCats().map(c=>c.name),...S.plans.map(p=>p.name)])];
}

  <section class="card">

      <select class="sel" id="tsort" aria-label="정렬">${[["date-desc","최근 날짜 순"],["date-asc","오래된 날짜 순"],["amt-desc","금액 큰 순"],["amt-asc","금액 작은 순"]].map(([k,l])=>`<option value="${k}" ${f.sort===k?"selected":""}>${l}</option>`).join("")}</select>

    </div>

  </section>`;
}

/* ---- budget ---- */
function budgetHtml(){
  const ym=S.month, s=st();
  const spentBy={}; txMonth(ym).filter(t=>t.type==="expense").forEach(t=>spentBy[t.category]=(spentBy[t.category]||0)+(+t.amount||0));
  const paidBy={}; txMonth(ym).filter(t=>t.type==="saving"||t.type==="invest").forEach(t=>paidBy[t.category]=(paidBy[t.category]||0)+(+t.amount||0));
  const vari = expenseCats().filter(c=>c.group!=="고정비"), fixed = expenseCats().filter(c=>c.group==="고정비"), plans=plansSorted();
  const alloc = sum(expenseCats(),c=>budgetFor(c.name,ym)) + sum(plans,p=>p.target);
  const total = +s.totalBudget||0;
  const item = (name,sub,b,used,kind,key,isO) => { const pct=b?used/b*100:(used?100:0); const over=used>b&&used>0;
    return `<div class="bitem"><div class="bitem-h"><div><b>${esc(name)}</b><small>${esc(sub)}${isO?" · 이번 달만":" · 기본 예산"}</small></div><b class="num">${won(b)}</b></div>
    <div class="bitem-n"><div>${kind==="plan"?"실제 납입":"실제 지출"}<b class="num">${won(used)}</b></div><div>${kind==="plan"?"남은 목표":"남은 예산"}<b class="num ${b-used<0?"neg":""}">${won(b-used)}</b></div></div>
    <div class="bar ${over&&kind!=="plan"?"over":""}"><i style="width:${Math.min(100,pct)}%"></i></div>
    <div class="bitem-f"><span class="num">${Math.round(pct)}%${over&&kind!=="plan"?" · 초과":""}</span><div class="acts"><button class="link" data-bedit="${esc(key)}" data-bkind="${kind}">수정</button>${kind==="cat"?`<button class="link" data-bonce="${esc(key)}">이번 달만</button>`:""}</div></div></div>`; };
  const group = (cls,title,sub,items,tot,used,label="예산 합계",usedLabel="실제 지출",remLabel="남은 예산") => `<section class="bgroup ${cls}"><div class="card-h" style="margin:0"><div><h2>${title}</h2><div style="font-size:11px;color:var(--mute)">${sub}</div></div><span class="aside">${items.length}개 항목</span></div>
    <div style="font-size:11px;color:var(--mute);margin-top:14px">${label}</div><div class="num" style="font-size:24px;font-weight:800">${won(tot)}</div>
    <div class="bg-sum"><div>${usedLabel}<b class="num">${won(used)}</b></div><div>${remLabel}<b class="num ${tot-used<0?"neg":""}">${won(tot-used)}</b></div></div>
    ${items.length?`<div class="bitems">${items.join("")}</div>`:`<div class="empty-st" style="padding:20px">항목이 없어요.</div>`}</section>`;
  const vItems = vari.map(c=>item(c.name,c.group,budgetFor(c.name,ym),spentBy[c.name]||0,"cat",c.name,isOverride(c.name,ym)));
  const fItems = fixed.map(c=>item(c.name,c.group,budgetFor(c.name,ym),spentBy[c.name]||0,"cat",c.name,isOverride(c.name,ym)));
  const pItems = plans.map(p=>item(p.name,p.type,+p.target||0,paidBy[p.name]||0,"plan",p.id,false));
  return pageHead(ymLabel(ym),"월 예산","항목별 예산과 실제 기록을 비교하세요.",monthPicker()+`<button class="btn pri" data-open="cat">${ic("plus",15)} 예산 추가</button>`)+`
  <div class="stats">${stat("월 기준 예산",won(total),"전체 예산(수입 계획)")}${stat("배분 합계",won(alloc),"소비 + 저축 + 투자")}${stat("미배분 금액",won(total-alloc),"월 기준 예산 − 배분 합계",true,total-alloc<0?"neg":"")}</div>

  ${group("fixed","고정비","매달 나가는 소비 지출",fItems,sum(fixed,c=>budgetFor(c.name,ym)),sum(fixed,c=>spentBy[c.name]||0))}

}

  const {kind,id,d}=M; M=null; render();

    if(kind==="tx") await api.del("tx",id);
    if(kind==="acc") await api.del("accounts",id);
    if(kind==="fixed") await api.del("fixed",id);
    if(kind==="plan") await api.del("plans",id);
    if(kind==="budget"){ const s=JSON.parse(JSON.stringify(st())); s.expenseCats=s.expenseCats.filter(c=>c.name!==d.name); if(s.baseBudget) delete s.baseBudget[d.name]; Object.values(s.monthBudget||{}).forEach(o=>delete o[d.name]); await api.saveSettings(s); }
    toast("삭제했어요");
  }catch(e){}
}

/* ---------- csv ---------- */
async function saveCsv(name,header,rows){
  if(!downloads){ toast("이 화면에서는 파일 저장을 쓸 수 없어요."); return; }
  const q = v => `"${String(v??"").replace(/"/g,'""')}"`;
  const csv = "﻿"+[header,...rows].map(r=>r.map(q).join(",")).join("\r\n");
  try{ const r = await downloads.save({filename:name,data:csv}); if(r && r.status==="saved") toast("파일을 저장했어요"); }catch(e){ if(e && e.code==="unavailable") downloads=null, render(); }
}
const txCsvRows = list => list.map(t=>[t.unit==="month"?t.month:t.date,TYPES[t.type],t.category,t.title,t.amount,t.method,t.memo,t.unit==="month"?"월 합계":"일별"]);

  const ys=$("#ysel"); if(ys) ys.onchange=()=>{ S.year=+ys.value; render(); };

  const c3=$("#csv-save"); if(c3) c3.onclick=()=>saveCsv(`저축투자_${S.month}.csv`,["날짜","유형","카테고리","내용","금액","결제수단","메모","기록단위"],txCsvRows(txMonth(S.month).filter(x=>x.type==="saving"||x.type==="invest")));

    f.querySelectorAll("[data-mtype]").forEach(b=>b.onclick=()=>{ readModal(); M.d.type=b.dataset.mtype; M.d.category=""; render(); });
    f.querySelectorAll("[data-mkind]").forEach(b=>b.onclick=()=>{ readModal(); M.d.kind=b.dataset.mkind; M.d.purpose=ACC_PURPOSE[M.d.kind][0]; render(); });
    const u=$("#m-unit"); if(u) u.onchange=()=>{ readModal(); render(); };
    $("#mcancel").onclick=()=>{ M=null; render(); };

    const orr=$("#once-reset"); if(orr) orr.onclick=async()=>{ const s=JSON.parse(JSON.stringify(st())); if(s.monthBudget&&s.monthBudget[S.month]) delete s.monthBudget[S.month][M.d.name]; M=null; await api.saveSettings(s); toast("기본 예산으로 되돌렸어요"); };

  }
}

function gateHtml(){
  const A=S.auth, t=A.tab;
  const brand=`<div class="brand" style="padding:0;margin-bottom:20px"><div class="brand-ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7a2 2 0 0 1 2-2h11v4M4 7v11a2 2 0 0 0 2 2h14V9H6a2 2 0 0 1-2-2zM16 14h1"/></svg></div><div><b>가계부</b><small>PERSONAL FINANCE</small></div></div>`;
  const msg=`${A.err?`<p class="err" role="alert" style="margin:4px 0 0">${esc(A.err)}</p>`:""}${A.msg?`<p role="status" style="color:var(--accent);font-size:12.5px;margin:4px 0 0">${esc(A.msg)}</p>`:""}`;
  let form="";
  if(t==="newpw"){
    form=`<h1>새 비밀번호 설정</h1><p>앞으로 로그인할 때 쓸 비밀번호를 입력하세요.</p>
    <form id="authform" style="margin-top:16px">${fld("새 비밀번호 (8자 이상)",'<input id="a-pw" type="password" autocomplete="new-password" required minlength="8">')}${fld("비밀번호 확인",'<input id="a-pw2" type="password" autocomplete="new-password" required minlength="8">')}${msg}
    <div class="btns"><button class="btn pri" type="submit" ${A.busy?"disabled":""}>비밀번호 저장</button></div></form>`;
  } else if(t==="reset"){
    form=`<h1>비밀번호 찾기</h1><p>가입한 이메일로 비밀번호 재설정 링크를 보내드려요.</p>
    <form id="authform" style="margin-top:16px">${fld("이메일",`<input id="a-email" type="email" autocomplete="email" required value="${esc(A.email||"")}">`)}${msg}
    <div class="btns"><button class="btn pri" type="submit" ${A.busy?"disabled":""}>재설정 링크 보내기</button><button class="btn" type="button" data-atab="login">로그인으로 돌아가기</button></div></form>`;
  } else {
    const su=t==="signup";
    form=`<div class="seg" style="margin-bottom:18px"><button type="button" data-atab="login" class="${!su?"on":""}">로그인</button><button type="button" data-atab="signup" class="${su?"on":""}">회원가입</button></div>
    <h1>${su?"가계부 시작하기":"다시 오셨네요"}</h1><p>${su?"가입하면 빈 대시보드와 기본 카테고리가 만들어져요. 내 기록은 나만 볼 수 있어요.":"이메일과 비밀번호로 로그인하세요."}</p>
    <form id="authform" style="margin-top:16px">${fld("이메일",`<input id="a-email" type="email" autocomplete="email" required value="${esc(A.email||"")}">`)}
    ${fld(su?"비밀번호 (8자 이상)":"비밀번호",`<input id="a-pw" type="password" autocomplete="${su?"new-password":"current-password"}" required ${su?'minlength="8"':""}>`)}
    ${su?fld("비밀번호 확인",'<input id="a-pw2" type="password" autocomplete="new-password" required minlength="8">'):""}${msg}
    <div class="btns"><button class="btn pri" type="submit" ${A.busy?"disabled":""}>${A.busy?"잠시만요…":su?"가입하기":"로그인"}</button>
    ${su?"":`<button class="link" type="button" data-atab="reset" style="align-self:center">비밀번호를 잊었어요</button>`}</div></form>`;
  }
  return `<div class="gate"><div class="gate-box">${brand}${form}
  <div style="border-top:1px solid var(--line2);margin-top:20px;padding-top:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><span style="font-size:11.5px;color:var(--mute)">계좌번호·카드번호는 입력받지 않아요.</span><button class="link" id="demo" type="button">저장 없이 둘러보기</button></div></div></div>`;
}
const AUTH_ERR = m => /Invalid login credentials/i.test(m)?"이메일 또는 비밀번호가 맞지 않아요.":/Email not confirmed/i.test(m)?"메일함에서 인증 링크를 먼저 눌러주세요.":/already registered|already exists/i.test(m)?"이미 가입된 이메일이에요. 로그인해 주세요.":/rate limit|too many/i.test(m)?"요청이 너무 많아요. 잠시 후 다시 시도해 주세요.":/password/i.test(m)?"비밀번호 조건을 확인해 주세요. (8자 이상)":/email/i.test(m)?"이메일 주소를 확인해 주세요.":"처리하지 못했어요. 잠시 후 다시 시도해 주세요.";
function bindGate(){
  const d=$("#demo"); if(d) d.onclick=startDemo;
  document.querySelectorAll("[data-atab]").forEach(b=>b.onclick=()=>{ const em=$("#a-email"); S.auth={tab:b.dataset.atab,msg:"",err:"",email:em?em.value:S.auth.email}; render(); });
  const f=$("#authform"); if(!f) return;
  f.onsubmit=async e=>{
    e.preventDefault(); const A=S.auth; const email=($("#a-email")||{}).value?.trim(), pw=($("#a-pw")||{}).value, pw2=($("#a-pw2")||{}).value;
    A.email=email||A.email; A.err=""; A.msg="";
    if((A.tab==="signup"||A.tab==="newpw") && pw!==pw2){ A.err="비밀번호 확인이 일치하지 않아요."; render(); return; }
    if(!sb){ A.err="로그인 모듈을 불러오지 못했어요."; render(); return; }
    A.busy=true; render();
    try{
      const back=location.origin+location.pathname;
      if(A.tab==="login"){ const {error}=await sb.auth.signInWithPassword({email,password:pw}); if(error) throw error; }
      if(A.tab==="signup"){ const {data,error}=await sb.auth.signUp({email,password:pw,options:{emailRedirectTo:back}}); if(error) throw error;
        if(!data.session){ S.auth={tab:"login",email,msg:"인증 메일을 보냈어요. 메일의 링크를 누르면 가입이 끝나요. (스팸함도 확인해 주세요)",err:""}; render(); return; } }
      if(A.tab==="reset"){ const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:back}); if(error) throw error; S.auth={tab:"login",email,msg:"재설정 링크를 보냈어요. 메일을 확인해 주세요.",err:""}; render(); return; }
      if(A.tab==="newpw"){ const {data,error}=await sb.auth.updateUser({password:pw}); if(error) throw error; S.auth={tab:"login",msg:"",err:""}; startSession(data.user); return; }
      A.busy=false;
    }catch(err){ A.busy=false; A.err=AUTH_ERR(err.message||""); render(); }
  };
}

let toastT=null;
function toast(msg){ let el=$(".toast"); if(!el){ el=document.createElement("div"); el.className="toast"; el.setAttribute("role","status"); document.body.appendChild(el);} el.textContent=msg; clearTimeout(toastT); toastT=setTimeout(()=>el.remove(),2600); }

if(location.hash==="#demo") startDemo(); else boot();
</script>
