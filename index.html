<style>
/* Layout: fixed left sidebar + gray workspace of white cards; top nav bar + floating add button on phones. */
:root{
  --bg:#f3f5f8; --card:#ffffff; --soft:#f6f7fa; --topbar:#fafbfc; --line:#e3e7ee; --line2:#eef1f5;
  --ink:#1b2333; --sub:#5d6678; --mute:#8c95a6;
  --accent:#4a63c4; --accent-ink:#ffffff; --accent-soft:#eaeefb; --navy:#26365a; --navy-sub:#c3cbe0;
  --bar-in:#7d93d6; --bar-out:#c9d1de; --neg:#c0443c; --neg-soft:#fbeceb; --ok:#2f8a5b; --ok-soft:#e6f4ec;
  --warn:#a0701c; --warn-soft:#fbf1dd; --warn-line:#efe1c6; --overlay:rgba(20,28,45,.42);
  --font:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11151d; --card:#191f2a; --soft:#202836; --topbar:#151a23; --line:#2a3242; --line2:#222a37;
  --ink:#e6eaf2; --sub:#aab3c4; --mute:#7f899c; --accent:#8199f0; --accent-ink:#0f1420; --accent-soft:#252f4b; --navy:#2a3a63; --navy-sub:#b8c3e0;
  --bar-in:#8199f0; --bar-out:#4a5468; --neg:#f08a80; --neg-soft:#3a2224; --ok:#5cc28c; --ok-soft:#1d3427;
  --warn:#e0b45a; --warn-soft:#2e2717; --warn-line:#4a3d1f; --overlay:rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151d; --card:#191f2a; --soft:#202836; --topbar:#151a23; --line:#2a3242; --line2:#222a37;
  --ink:#e6eaf2; --sub:#aab3c4; --mute:#7f899c; --accent:#8199f0; --accent-ink:#0f1420; --accent-soft:#252f4b; --navy:#2a3a63; --navy-sub:#b8c3e0;
  --bar-in:#8199f0; --bar-out:#4a5468; --neg:#f08a80; --neg-soft:#3a2224; --ok:#5cc28c; --ok-soft:#1d3427;
  --warn:#e0b45a; --warn-soft:#2e2717; --warn-line:#4a3d1f; --overlay:rgba(0,0,0,.55); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink);margin:0}
body{font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,td.r,.amt{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

.app{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:100vh}
.side{background:var(--card);border-right:1px solid var(--line);padding:22px 12px;display:flex;flex-direction:column;gap:24px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand-ic{width:34px;height:34px;border-radius:9px;background:var(--navy);display:grid;place-items:center;flex:none;color:#fff}
.brand b{font-size:17px;font-weight:800;display:block;line-height:1.1;white-space:nowrap}
.brand small{font-size:7.5px;letter-spacing:.18em;color:var(--mute);font-weight:500}
.nav-h{font-size:11px;color:var(--mute);padding:0 10px;margin-bottom:6px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:10px;border-radius:8px;color:var(--sub);font-size:13.5px;text-align:left;white-space:nowrap}
.nav button svg{flex:none;color:var(--mute)}
.nav button:hover{background:var(--bg)}
.nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.nav button.on svg{color:var(--accent)}
.nav button.on::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent);margin-left:auto}
.side-foot{margin-top:auto;font-size:12px;color:var(--sub);display:flex;flex-direction:column;gap:10px;padding:0 8px}
.side-foot .lock{display:flex;gap:6px;align-items:center}
.side-foot p{margin:0;font-size:11px;color:var(--mute);line-height:1.5}

.top{height:58px;border-bottom:1px solid var(--line);background:var(--topbar);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-left:24px;padding-right:24px;font-size:12px;color:var(--sub)}
.top-r{display:flex;align-items:center;gap:14px}
.icon-btn{border:0;background:none;padding:6px;border-radius:6px;color:var(--sub);display:grid;place-items:center}
.icon-btn:hover{background:var(--line2)}
main{padding-block:28px 40px;padding-left:24px;padding-right:24px;max-width:1180px;width:100%}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.eyebrow{font-size:11.5px;color:var(--accent);font-weight:700}
h1{font-size:26px;font-weight:800;margin:4px 0 6px;letter-spacing:-.01em;text-wrap:balance}
.ph p{margin:0;color:var(--sub);font-size:12.5px}
.ph-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mpick{display:flex;align-items:center;border:1px solid var(--line);background:var(--card);border-radius:8px;height:38px;padding:0 4px}
.mpick button{border:0;background:none;width:30px;height:30px;border-radius:6px;display:grid;place-items:center;color:var(--sub)}
.mpick button:hover{background:var(--bg)}
.mpick span{font-size:13px;min-width:96px;text-align:center;font-weight:500}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;height:38px;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--mute)}
.btn:disabled{opacity:.55;cursor:default}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.pri:hover{filter:brightness(.94)}
.btn.sm{height:32px;padding:0 10px;font-size:12px}
.btn.danger{color:var(--neg)}
.btn.danger.armed{background:var(--neg);color:#fff;border-color:var(--neg)}
.link{border:0;background:none;color:var(--accent);font-size:12px;font-weight:600;padding:2px 0;display:inline-flex;align-items:center;gap:2px}
.link:hover{text-decoration:underline}
.link.mute{color:var(--sub);font-weight:500}
.link.danger{color:var(--neg)}

.stats{display:grid;gap:12px;margin-bottom:18px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 16px;min-width:0}
.stat .k{font-size:11.5px;color:var(--sub)}
.stat .v{font-size:21px;font-weight:800;margin:6px 0 4px;letter-spacing:-.01em;overflow-wrap:anywhere}
.stat .s{font-size:11px;color:var(--mute)}
.stat.dark{background:var(--navy);border-color:var(--navy);color:#fff}
.stat.dark .k,.stat.dark .s{color:var(--navy-sub)}
.stat.dark .v.neg{color:#ffb7b0}
.delta{font-size:10.5px;font-weight:700;margin-left:4px}
.delta.up{color:var(--neg)} .delta.down{color:var(--ok)} .delta.inc{color:var(--ok)} .delta.dec{color:var(--neg)}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card-h h2{font-size:15px;font-weight:800;margin:0}
.card-h .aside{font-size:11px;color:var(--mute)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:14px}
.banner{border:1px solid var(--warn-line);background:var(--warn-soft);color:var(--warn);font-size:12px;padding:10px 14px;border-radius:8px;margin-bottom:12px}
.empty-st{padding:40px 10px;text-align:center;color:var(--mute);font-size:12.5px}
.note{font-size:11.5px;color:var(--mute);margin:12px 0 0}

.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--soft);color:var(--mute);font-weight:500;font-size:11.5px;text-align:left;padding:10px 12px;white-space:nowrap}
td{padding:13px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
td.r,th.r{text-align:right}
td .t{font-weight:600}
td .d{font-size:11px;color:var(--mute);margin-top:2px;max-width:340px}
.neg{color:var(--neg)} .pos{color:var(--accent)}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:5px;background:var(--line2);color:var(--sub);white-space:nowrap}
.pill.blue{background:var(--accent-soft);color:var(--accent)}
.pill.green{background:var(--ok-soft);color:var(--ok)}
.pill.red{background:var(--neg-soft);color:var(--neg)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.tag{display:inline-block;font-size:10.5px;color:var(--accent);margin-right:4px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none;vertical-align:middle}
.acts{display:flex;gap:10px;justify-content:flex-end;white-space:nowrap;align-items:center}

.chart-legend{display:flex;gap:14px;font-size:11px;color:var(--sub);align-items:center;justify-content:space-between;margin-bottom:6px}
.chart-legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle}
.chart svg{width:100%;height:auto;max-height:230px;display:block}
.chart text{fill:var(--mute);font-size:10px;font-family:var(--font)}

.donut-wrap{display:grid;grid-template-columns:150px minmax(0,1fr);gap:18px;align-items:center}
.donut svg{width:150px;height:150px;display:block}
.donut text{fill:var(--ink);font-family:var(--font)}
.legend{display:flex;flex-direction:column;gap:8px;font-size:12.5px;min-width:0}
.legend div{display:grid;grid-template-columns:12px minmax(0,1fr) auto auto;gap:8px;align-items:center}
.legend span:nth-child(2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend .pct{color:var(--mute);font-size:11px;min-width:34px;text-align:right}

.bgroup{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:20px;margin-bottom:14px;border-top:3px solid var(--gc,var(--navy))}
.bg-sum{background:var(--soft);border-radius:8px;display:grid;grid-template-columns:1fr 1fr;padding:12px 14px;margin:12px 0 4px;font-size:12px;color:var(--sub)}
.bg-sum b{display:block;font-size:14px;color:var(--ink)}
.bitems{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:28px}
.bitem{padding:16px 0;border-bottom:1px solid var(--line2);min-width:0}
.bitem-h{display:flex;justify-content:space-between;gap:8px}
.bitem-h b{font-size:13px}
.bitem-h small{display:block;font-size:10.5px;color:var(--mute)}
.bitem-n{display:grid;grid-template-columns:1fr 1fr;margin-top:8px;font-size:11px;color:var(--mute)}
.bitem-n b{display:block;color:var(--ink);font-size:13px}
.bar{height:5px;border-radius:3px;background:var(--line2);margin:10px 0 4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.bar.warn i{background:var(--warn)}
.bar.over i{background:var(--neg)}
.bitem-f{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;color:var(--mute);gap:8px}
.bitem-f .acts{gap:12px}

.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));margin-top:16px;border-top:1px solid var(--line2);padding-top:14px;gap:10px 0}
.split>div{padding:0 12px;border-left:1px solid var(--line2);font-size:11.5px;color:var(--sub)}
.split>div:first-child{border-left:0;padding-left:0}
.split b{display:block;color:var(--ink);font-size:14px;margin:2px 0}
.split small{font-size:10.5px;color:var(--mute)}
.alerts{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.allow{display:flex;justify-content:space-between;align-items:center;background:var(--soft);border-radius:8px;padding:10px 12px;margin-top:12px;font-size:12px;color:var(--sub)}
.allow b{font-size:15px;color:var(--ink)}
.minirow{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line2);gap:10px}
.minirow small{display:block;font-size:10.5px;color:var(--mute)}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--sub)}
.chip b{font-size:20px;color:var(--ink)}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{flex:1 1 220px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;height:38px;padding:0 12px;background:var(--card);min-width:0;color:var(--mute)}
.search input{border:0;outline:0;background:none;flex:1;min-width:0;font-size:13px;color:var(--ink)}
select.sel{height:38px;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:0 10px;font-size:12.5px;max-width:100%}
.check{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--sub)}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:6px 12px;border-radius:7px;font-size:12.5px;color:var(--sub)}
.tabs button.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.tabs .cnt{font-size:10.5px;background:var(--line2);border-radius:4px;padding:1px 6px;margin-left:5px;color:var(--sub)}
.sec-h{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;margin:22px 0 10px}
.acc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.acc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.acc-top{display:flex;gap:14px;align-items:center;min-width:0}
.logo{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;font-weight:800;font-size:15px;flex:none;color:#fff}
.acc-top b{font-size:15px;display:block}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:3px}
.memo{background:var(--soft);border-radius:8px;padding:10px 12px;font-size:12px;color:var(--sub);display:flex;gap:12px}
.memo span:first-child{color:var(--mute);flex:none}
.acc-f{border-top:1px solid var(--line2);padding-top:10px;display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--mute);margin-top:auto;gap:8px}
.acc-f .bal{font-size:15px;color:var(--ink);font-weight:800}

.result{border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:16px 18px;margin:14px 0 20px}
.result-h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--mute)}
.result-h b{font-size:14px;color:var(--ink)}
.result-n{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-top:12px;font-size:11.5px;color:var(--sub)}
.result-n b{display:block;font-size:14px;color:var(--ink)}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:14px 4px 6px;border-bottom:1px solid var(--line);font-size:12px;color:var(--sub);flex-wrap:wrap}
.dayhead b{color:var(--ink);font-size:13px}
.dayhead .sums{display:flex;gap:10px;font-size:11.5px}
.txrow{display:grid;grid-template-columns:14px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line2)}
.txrow .t{font-weight:600;font-size:13px;overflow-wrap:anywhere}
.txrow .d{font-size:11px;color:var(--mute);overflow-wrap:anywhere}
.txrow .amt{font-weight:700;text-align:right;white-space:nowrap}
.pager{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:11px;color:var(--mute);gap:10px;flex-wrap:wrap}
.pager .pg{display:flex;align-items:center;gap:8px}
.pager button{width:28px;height:28px;border:1px solid var(--line);background:var(--card);border-radius:6px}
.pager button:disabled{opacity:.4;cursor:default}
.filter-chip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);border:0;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600}

.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:6px}
.cal .wd{font-size:11px;color:var(--mute);text-align:center;padding:4px 0}
.cal .wd.sun{color:var(--neg)}
.cday{border:1px solid var(--line2);background:var(--card);border-radius:8px;min-height:72px;padding:6px;text-align:left;display:flex;flex-direction:column;gap:2px;font-size:11px;min-width:0;position:relative;overflow:hidden}
.cday .n{font-weight:700;color:var(--sub);font-size:11.5px}
.cday.today .n{color:var(--accent)}
.cday .o{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;position:relative}
.cday .i{color:var(--accent);font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;position:relative}
.cday .heat{position:absolute;inset:0;background:var(--neg);pointer-events:none}
.cday.blank{border:0;background:none}
.cday:not(.blank):hover{border-color:var(--accent)}

.set-sec{margin-bottom:16px}
.catrow{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 2px;border-bottom:1px solid var(--line2)}
.catrow .nm{font-weight:600;font-size:13px}
.catrow .sb{font-size:11px;color:var(--mute);overflow-wrap:anywhere}
.ord{border:1px solid var(--line);background:var(--card);border-radius:6px;width:28px;height:28px;display:grid;place-items:center;color:var(--sub)}
.ord:disabled{opacity:.35;cursor:default}
.grp-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:18px 0 4px;flex-wrap:wrap}
.grp-h b{font-size:14px}
.optrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.optrow .lbl b{display:block;font-size:13px}
.optrow .lbl small{font-size:11.5px;color:var(--mute)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{flex:1;border:0;background:var(--card);padding:8px 12px;font-size:12.5px;color:var(--sub);border-left:1px solid var(--line);white-space:nowrap}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
.menu-checks{display:flex;flex-wrap:wrap;gap:8px 16px}

.ov{position:fixed;inset:0;background:var(--overlay);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--card);border-radius:14px;width:min(480px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:22px;border:1px solid var(--line)}
.modal h3{margin:0 0 16px;font-size:17px;font-weight:800}
.f{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;min-width:0}
.f label{font-size:12px;color:var(--sub);font-weight:500}

<script>
"use strict";
/* =================== 기본값 (누구에게나 무난한 항목, 모두 편집 가능) =================== */
const PALETTE = ["#5b7be0","#e0855b","#4fae7f","#c9a03c","#9a6bd6","#d65b7a","#3fa3b8","#8c94a6","#b46f3c","#6c8f3a","#d1785f","#5f6fd1","#c45fa0","#3c8c8c"];
const DEFAULT_GROUPS = [{id:"g1",name:"생활비"},{id:"g2",name:"고정지출"},{id:"g3",name:"여가·기타"}];
const DEFAULT_EXPENSE = [
  ["식비","g1","#e0855b"],["카페·간식","g1","#c9a03c"],["생활용품","g1","#4fae7f"],["교통","g1","#3fa3b8"],["의료·건강","g1","#d65b7a"],
  ["주거·관리비","g2","#5b7be0"],["통신","g2","#9a6bd6"],["보험","g2","#6c8f3a"],["구독","g2","#b46f3c"],
  ["쇼핑","g3","#d1785f"],["문화·여가","g3","#5f6fd1"],["경조사·선물","g3","#c45fa0"],["교육","g3","#3c8c8c"],["기타","g3","#8c94a6"]
].map(([name,group,color])=>({name,group,color,subs:[]}));
const DEFAULT_INCOME = [["급여","#5b7be0"],["부수입","#4fae7f"],["용돈","#c9a03c"],["금융수익","#9a6bd6"],["기타","#8c94a6"]].map(([name,color])=>({name,color}));
const DEFAULT_PREFS = {monthStart:1, hidden:[], short:false, font:1, theme:"light"};
const TYPES = {income:"수입",expense:"지출",saving:"저축",invest:"투자",transfer:"이체"};
const TRANSFER_CATS = ["계좌 간 이체","카드 대금","기타 이체"];
const ACC_PURPOSE = {"계좌":["입출금","CMA","예적금","청약","간편결제","증권","기타"],"카드":["체크카드","신용카드","선불·상품권","기타"]};
function defaultSettings(){ return normSettings({groups:DEFAULT_GROUPS.map(g=>({...g})),expenseCats:DEFAULT_EXPENSE.map(c=>({...c,subs:[]})),incomeCats:DEFAULT_INCOME.map(c=>({...c})),baseBudget:{},monthBudget:{},totalBudget:0,prefs:{...DEFAULT_PREFS}}); }

/* =================== 도우미 =================== */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const today = new Date();
const ymOf = d => d.getFullYear()+"-"+pad(d.getMonth()+1);
const dateStr = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const todayStr = dateStr(today);
const shiftYm = (ym,k) => { const [y,m]=ym.split("-").map(Number); return ymOf(new Date(y,m-1+k,1)); };
const lastDay = ym => { const [y,m]=ym.split("-").map(Number); return new Date(y,m,0).getDate(); };
const parseAmt = v => { const n = Number(String(v).replace(/[^\d.-]/g,"")); return isFinite(n)?Math.round(n):0; };
const sum = (arr,f=x=>x) => arr.reduce((a,x)=>a+(+f(x)||0),0);
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const clone = o => JSON.parse(JSON.stringify(o));
const WD = ["일","월","화","수","목","금","토"];
const trim1 = x => (Math.round(x*10)/10).toLocaleString("ko-KR",{maximumFractionDigits:1});
function won(n,full){ n=Math.round(+n||0); if(prefs().short && !full){ const a=Math.abs(n), s=n<0?"-":""; if(a>=1e8) return s+trim1(a/1e8)+"억원"; if(a>=1e4) return s+trim1(a/1e4)+"만원"; } return n.toLocaleString("ko-KR")+"원"; }
const wonShort = n => { const a=Math.abs(Math.round(n)); return a>=1e8?trim1(a/1e8)+"억":a>=1e4?trim1(a/1e4)+"만":a.toLocaleString("ko-KR"); };
const parseTags = s => [...new Set(String(s||"").split(/[\s,#]+/).map(x=>x.trim()).filter(Boolean))].slice(0,5).map(x=>x.slice(0,20));

const ICON = {
  home:'<path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/>', tx:'<path d="M4 8h14l-3-3M20 16H6l3 3"/>',
  acc:'<path d="M4 7a2 2 0 0 1 2-2h11v4M4 7v11a2 2 0 0 0 2 2h14V9H6a2 2 0 0 1-2-2zM16 14h1"/>',
  budget:'<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M14 4v4M8 10v4M16 16v4"/>', save:'<path d="M12 3v18M17 7H9.5a3 3 0 0 0 0 6h5a3 3 0 0 1 0 6H6"/>',
  fixed:'<path d="M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3"/>', year:'<path d="M5 20V11M12 20V5M19 20v-7"/>',
  set:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/>',
  prev:'<path d="M15 6l-6 6 6 6"/>', next:'<path d="M9 6l6 6-6 6"/>', plus:'<path d="M12 5v14M5 12h14"/>', up:'<path d="M6 15l6-6 6 6"/>', down:'<path d="M6 9l6 6 6-6"/>',
  refresh:'<path d="M20 11a8 8 0 0 0-14.5-4.5L4 8M4 4v4h4M4 13a8 8 0 0 0 14.5 4.5L20 16M20 20v-4h-4"/>', x:'<path d="M6 6l12 12M18 6L6 18"/>',
  search:'<circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/>', dl:'<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',
  lock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>', chev:'<path d="M9 6l6 6-6 6"/>'
};
const ic = (k,s=17) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[k]}</svg>`;

/* =================== 상태 =================== */
const S = {
  mode:null, me:null, settings:null, tx:[], accounts:[], fixed:[], plans:[], ready:false,
  view:"home", month:ymOf(today), year:today.getFullYear(),
  tf:{type:"all",q:"",cat:"",tag:"",acc:"",sort:"date-desc",page:1,all:false,day:"",mode:"list"}, af:{q:"",kind:"all"},
  setTab:"expense", loadNote:"", more:false, auth:{tab:"login",msg:"",err:""}
};
let api = null, M = null;

/* =================== 설정 정규화 / 화면 설정 =================== */
function normSettings(raw){
  raw = raw || {};
  const s = {baseBudget:{}, monthBudget:{}, totalBudget:0, ...raw};
  s.prefs = {...DEFAULT_PREFS, ...(raw.prefs||{})};
  if(!Array.isArray(s.prefs.hidden)) s.prefs.hidden=[];
  let groups = Array.isArray(raw.groups) ? raw.groups.filter(g=>g&&g.id&&g.name).map(g=>({id:String(g.id),name:String(g.name)})) : [];
  const cats = (raw.expenseCats||[]).map(c=> typeof c==="string" ? {name:c} : {...c});
  cats.forEach((c,i)=>{
    if(!groups.find(g=>g.id===c.group)){ let g=groups.find(g=>g.name===c.group); if(!g){ g={id:"g"+uid(),name:c.group||"지출"}; groups.push(g); } c.group=g.id; }
    c.subs = Array.isArray(c.subs) ? c.subs.filter(Boolean) : [];
    c.color = c.color || PALETTE[i%PALETTE.length];
  });
  if(!groups.length) groups=[{id:"g1",name:"지출"}];
  s.groups = groups; s.expenseCats = cats;
  s.incomeCats = (raw.incomeCats||[]).map((c,i)=> typeof c==="string" ? {name:c,color:PALETTE[(i+4)%PALETTE.length]} : {color:PALETTE[i%PALETTE.length],...c});
  s.baseBudget = s.baseBudget||{}; s.monthBudget = s.monthBudget||{}; s.totalBudget = +s.totalBudget||0;
  return s;
}
const st = () => S.settings || defaultSettings();
const prefs = () => (S.settings && S.settings.prefs) || DEFAULT_PREFS;
function applyPrefs(){
  const p = prefs(), root=document.documentElement;
  if(p.theme==="dark"||p.theme==="light") root.setAttribute("data-theme",p.theme); else root.removeAttribute("data-theme");
  try{ localStorage.setItem("gb-theme",p.theme||"system"); }catch(e){}
  const r=$("#root"); if(r) r.style.zoom = (S.mode==="db"||S.mode==="demo") ? String(p.font||1) : "1";
}

/* =================== 기간 (한 달 시작일) =================== */
const startDay = () => Math.min(28, Math.max(1, +prefs().monthStart||1));
function periodOfDate(ds){ const [y,m,d]=ds.split("-").map(Number); if(d>=startDay()) return `${y}-${pad(m)}`; return ymOf(new Date(y,m-2,1)); }
const periodOf = t => t.unit==="month" ? t.month : periodOfDate(t.date);
function periodRange(ym){ const [y,m]=ym.split("-").map(Number), sd=startDay(); return [new Date(y,m-1,sd), new Date(y,m,sd-1)]; }
const curPeriod = () => periodOfDate(todayStr);
function periodLabel(ym){ const [y,m]=ym.split("-"); const base=`${y}년 ${+m}월`; if(startDay()===1) return base; const [s,e]=periodRange(ym); return `${base} (${s.getMonth()+1}.${s.getDate()}~${e.getMonth()+1}.${e.getDate()})`; }
const shortLabel = ym => { const [y,m]=ym.split("-"); return `${y}. ${+m}월`; };

/* =================== 계산 =================== */
const expenseCats = () => st().expenseCats;
const incomeCats = () => st().incomeCats;
const groups = () => st().groups;
const catOf = (type,name) => type==="expense" ? expenseCats().find(c=>c.name===name) : type==="income" ? incomeCats().find(c=>c.name===name) : null;
const colorOf = (type,name) => { const c=catOf(type,name); if(c) return c.color; if(type==="saving"||type==="invest") return "#3fa3b8"; if(type==="transfer") return "#8c94a6"; return "#8c94a6"; };
const groupOf = name => { const c=expenseCats().find(c=>c.name===name); return c ? c.group : "_none"; };
const txIn = ym => S.tx.filter(t=>periodOf(t)===ym);
const budgetFor = (cat,ym) => { const s=st(); const o=s.monthBudget[ym]; if(o && o[cat]!=null) return +o[cat]; return +(s.baseBudget[cat]||0); };
const isOverride = (cat,ym) => { const o=st().monthBudget[ym]; return !!(o && o[cat]!=null); };
const plansSorted = () => S.plans.slice().sort((a,b)=>(a.order??99)-(b.order??99)||a.name.localeCompare(b.name,"ko"));
function totals(ym){ const t=txIn(ym); const by=k=>sum(t.filter(x=>x.type===k),x=>x.amount); return {income:by("income"),expense:by("expense"),saving:by("saving"),invest:by("invest"),count:t.length}; }
const accById = id => S.accounts.find(a=>a.id===id);
const accName = id => { const a=accById(id); return a ? a.name : ""; };
function txEffect(t,id){ const x=+t.amount||0; let e=0; if(t.account_id===id) e += t.type==="income" ? x : -x; if(t.to_account_id===id && t.type!=="income" && t.type!=="expense") e += x; return e; }
function accBalance(a){ if(a.kind==="카드") return null; const since=a.balance_at||""; let b=+a.balance||0; for(const t of S.tx){ if(since && String(t.created_at||"")<=since) continue; b+=txEffect(t,a.id); } return b; }
const cardUsage = (a,ym) => sum(txIn(ym).filter(t=>t.account_id===a.id&&t.type==="expense"),t=>t.amount);
function budgetState(used,b){ if(!b) return used?"over":""; const p=used/b*100; return p>=100&&used>0?"over":p>=80?"warn":""; }
const visibleNav = () => NAV.filter(([k])=>k==="home"||k==="set"||!prefs().hidden.includes(k));

/* =================== Supabase =================== */
const SUPABASE_URL = "https://exrqsdngmzmhmyaupcxz.supabase.co";
const SUPABASE_KEY = "sb_publishable_j3KdfFEGNNZjYL7sQA4Lsg_YPawBz54"; // 공개용 키: 데이터 보호는 DB의 RLS가 담당
let sb = null;
const TABLE = {tx:"transactions",accounts:"accounts",fixed:"fixed_costs",plans:"plans"};
const COLS = {
  tx:["type","unit","date","month","amount","category","sub","title","method","memo","tags","account_id","to_account_id","recurring_id"],
  accounts:["kind","name","institution","purpose","balance","balance_at","link","memo"],
  fixed:["name","type","category","sub","day","amount","active","auto","account_id","to_account_id","start_month","last_month","tags","memo"],
  plans:["name","type","target","memo","sort"]
};
function fromRow(col,r){ const o={...r}; if(col==="tx"){ o.createdAt=r.created_at; if(o.date) o.date=String(o.date).slice(0,10); } if(col==="plans") o.order=r.sort; ["amount","balance","target"].forEach(k=>{ if(o[k]!=null) o[k]=+o[k]; }); if(!Array.isArray(o.tags)) o.tags=[]; return o; }
function toRow(col,obj){ const src={...obj}; if(col==="plans") src.sort=obj.order??99; const r={}; COLS[col].forEach(k=>{ if(src[k]!==undefined) r[k]=src[k]; }); ["account_id","to_account_id","recurring_id"].forEach(k=>{ if(r[k]==="") r[k]=null; }); if(col!=="plans") r.updated_at=new Date().toISOString(); return r; }
const settingsFrom = r => normSettings({groups:r.groups,expenseCats:r.expense_cats,incomeCats:r.income_cats,baseBudget:r.base_budget,monthBudget:r.month_budget,totalBudget:r.total_budget,prefs:r.prefs});
const settingsTo = s => ({groups:s.groups,expense_cats:s.expenseCats,income_cats:s.incomeCats,base_budget:s.baseBudget||{},month_budget:s.monthBudget||{},total_budget:Math.max(0,+s.totalBudget||0),prefs:s.prefs||{},updated_at:new Date().toISOString()});

function upsertLocal(col,o){ const i=S[col].findIndex(x=>x.id===o.id); if(i>=0) S[col][i]=o; else S[col].push(o); }
function renameLocal(kind,old,nw){
  const types = kind==="expense"?["expense"]:kind==="income"?["income"]:["saving","invest"];
  S.tx.forEach(t=>{ if(types.includes(t.type)&&t.category===old) t.category=nw; });
  S.fixed.forEach(f=>{ if(types.includes(f.type||"expense")&&f.category===old) f.category=nw; });
}
function makeSbApi(userId){
  const fail = e => { handleWriteError(e); throw e; };
  let chain = Promise.resolve();
  return {
    async put(col,id,obj){ const {data,error}=await sb.from(TABLE[col]).update(toRow(col,obj)).eq("id",id).select().single(); if(error) fail(error); upsertLocal(col,fromRow(col,data)); render(); },
    async add(col,obj,quiet){ const {data,error}=await sb.from(TABLE[col]).insert(toRow(col,obj)).select().single(); if(error){ if(quiet) throw error; fail(error); } upsertLocal(col,fromRow(col,data)); render(); return data; },
    async del(col,id){ const {error}=await sb.from(TABLE[col]).delete().eq("id",id); if(error) fail(error); S[col]=S[col].filter(x=>x.id!==id); render(); },
    saveSettings(s){ S.settings=s; applyPrefs(); render(); chain=chain.then(async()=>{ const {error}=await sb.from("settings").update(settingsTo(s)).eq("user_id",userId); if(error) handleWriteError(error); }); return chain; },
    async rename(kind,old,nw){
      const types = kind==="expense"?["expense"]:kind==="income"?["income"]:["saving","invest"];
      for(const ty of types){
        const a=await sb.from("transactions").update({category:nw}).eq("category",old).eq("type",ty); if(a.error) fail(a.error);
        const b=await sb.from("fixed_costs").update({category:nw}).eq("category",old).eq("type",ty); if(b.error) fail(b.error);
      }
      renameLocal(kind,old,nw);
    },
    async password(pw){ const {error}=await sb.auth.updateUser({password:pw}); if(error) throw error; },
    async deleteAccount(){ const {error}=await sb.rpc("delete_my_account"); if(error) throw error; await sb.auth.signOut(); }
  };
}
function makeDemoApi(){
  return {
    async put(col,id,obj){ const o={...(S[col].find(x=>x.id===id)||{}),...obj,id}; if(col==="tx"&&!o.created_at) o.created_at=new Date().toISOString(); upsertLocal(col,o); render(); },
    async add(col,obj,quiet){ if(col==="tx"&&obj.recurring_id&&S.tx.some(t=>t.recurring_id===obj.recurring_id&&t.month===obj.month)){ const e={message:"duplicate key"}; if(quiet) throw e; handleWriteError(e); throw e; } const o={...obj,id:uid(),created_at:new Date().toISOString()}; if(col==="tx") o.createdAt=o.created_at; upsertLocal(col,o); render(); return o; },
    async del(col,id){ S[col]=S[col].filter(x=>x.id!==id); if(col==="accounts") S.tx.forEach(t=>{ if(t.account_id===id) t.account_id=null; if(t.to_account_id===id) t.to_account_id=null; }); render(); },
    async saveSettings(s){ S.settings=s; applyPrefs(); render(); },
    async rename(kind,old,nw){ renameLocal(kind,old,nw); },
    async password(){ },
    async deleteAccount(){ resetState(); S.mode="gate"; }
  };
}
function handleWriteError(e){
  console.error(e); const m=(e&&e.message)||"";
  if(/JWT|expired|session/i.test(m)) toast("로그인이 만료됐어요. 다시 로그인해 주세요.");
  else if(/duplicate|unique/i.test(m)) toast("이미 같은 항목이 있어요.");
  else if(/check constraint|too long/i.test(m)) toast("입력값을 확인해 주세요. 글자 수가 너무 길 수 있어요.");
  else if(/not found/i.test(m)) toast("연결한 계좌나 항목을 찾을 수 없어요. 새로고침 후 다시 시도해 주세요.");
  else toast("저장하지 못했어요. 네트워크를 확인하고 다시 시도해 주세요.");
}
async function fetchAll(table){
  let out=[], from=0;
  for(;;){ const {data,error}=await sb.from(table).select("*").order("created_at",{ascending:true}).range(from,from+999); if(error) throw error; out=out.concat(data); if(data.length<1000) break; from+=1000; }
  return out;
}

  S.tf={type:"all",q:"",cat:"",tag:"",acc:"",sort:"date-desc",page:1,all:false,day:"",mode:"list"}; S.af={q:"",kind:"all"}; api=null; M=null;

async function startSession(user){
  resetState(); S.mode="db"; S.me={id:user.id,email:user.email||""}; api=makeSbApi(user.id); render();
  try{
    let {data:row,error}=await sb.from("settings").select("*").maybeSingle(); if(error) throw error;
    if(!row){ const ins=await sb.from("settings").insert(settingsTo(defaultSettings())).select().single(); if(ins.error) throw ins.error; row=ins.data; }
    const [tx,acc,fx,pl]=await Promise.all(["transactions","accounts","fixed_costs","plans"].map(fetchAll));
    if(!S.me || S.me.id!==user.id) return;
    S.settings=settingsFrom(row); S.tx=tx.map(r=>fromRow("tx",r)); S.accounts=acc.map(r=>fromRow("accounts",r)); S.fixed=fx.map(r=>fromRow("fixed",r)); S.plans=pl.map(r=>fromRow("plans",r));
    S.ready=true; S.loadNote=""; S.month=curPeriod(); applyPrefs();
    render();
    runRecurring();
  }catch(e){ console.error(e); S.loadNote="데이터를 불러오지 못했어요. 잠시 후 새로고침해 주세요."; render(); }
}
function startDemo(){
  resetState(); S.mode="demo"; S.me={email:"체험 모드"}; api=makeDemoApi();

async function boot(){
  if(!window.supabase){ S.mode="gate"; S.auth.err="로그인 모듈을 불러오지 못했어요. 새로고침해 주세요."; render(); return; }
  sb = window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  sb.auth.onAuthStateChange((ev,session)=>{
    setTimeout(()=>{
      if(ev==="PASSWORD_RECOVERY"){ S.mode="gate"; S.auth={tab:"newpw",msg:"",err:""}; render(); return; }
      if(ev==="SIGNED_OUT"){ const msg=S.auth.byeMsg||"로그아웃했어요."; resetState(); S.mode="gate"; S.auth={tab:"login",msg,err:""}; applyPrefs(); render(); return; }
      if(session && session.user && S.auth.tab!=="newpw" && !(S.mode==="db" && S.me && S.me.id===session.user.id)) startSession(session.user);
    },0);
  });
  const {data}=await sb.auth.getSession();
  if(data && data.session){ if(!(S.mode==="db" && S.me)) startSession(data.session.user); }
  else if(S.mode!=="db"){ S.mode="gate"; render(); }
}
async function logout(){
  if(S.mode==="demo"){ resetState(); S.mode="gate"; render(); return; }
  try{ await sb.auth.signOut(); }catch(e){ resetState(); S.mode="gate"; render(); }
}

/* =================== 반복 거래 자동 기록 =================== */
let recurringRunning=false;
async function runRecurring(){
  if(recurringRunning||!api) return; recurringRunning=true;
  const cur=ymOf(today); let made=0;
  try{
    for(const f of S.fixed.slice()){
      if(f.active===false || !f.auto) continue;
      let m = f.last_month ? shiftYm(f.last_month,1) : (f.start_month || cur); let last=null, guard=0;
      while(m<=cur && guard++<24){
        const ds=`${m}-${pad(Math.min(f.day||1,lastDay(m)))}`; if(ds>todayStr) break;
        try{ await api.add("tx",{type:f.type||"expense",unit:"day",date:ds,month:m,amount:f.amount,category:f.category||"",sub:f.sub||"",title:f.name,method:accName(f.account_id),memo:"반복 거래 자동 기록",tags:f.tags||[],account_id:f.account_id||null,to_account_id:f.to_account_id||null,recurring_id:f.id},true); made++; }
        catch(e){ if(!/duplicate|unique/i.test(e.message||"")) throw e; }
        last=m; m=shiftYm(m,1);
      }
      if(last) await api.put("fixed",f.id,{...f,last_month:last});
    }
    if(made) toast(`반복 거래 ${made}건을 자동으로 기록했어요`);
  }catch(e){ console.error(e); }
  recurringRunning=false;
}

function donut(items,total){
  const R=56, C=2*Math.PI*R; let off=0;
  const segs = items.map(([,v,c])=>{ const len=total?v/total*C:0; const s=`<circle cx="75" cy="75" r="${R}" fill="none" stroke="${c}" stroke-width="20" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 75 75)"/>`; off+=len; return s; }).join("");
  return `<svg viewBox="0 0 150 150" role="img" aria-label="카테고리별 지출 비중"><circle cx="75" cy="75" r="${R}" fill="none" stroke="var(--line2)" stroke-width="20"/>${segs}<text x="75" y="70" text-anchor="middle" font-size="10" style="fill:var(--mute)">소비 지출</text><text x="75" y="88" text-anchor="middle" font-size="13" font-weight="800">${esc(wonShort(total))}</text></svg>`;
}

const isMobile = () => window.matchMedia("(max-width:640px)").matches;
function periodChart(yms,opts={}){
  const rows=yms.map(ym=>totals(ym)), m=isMobile();
  const max=Math.max(1,...rows.map(r=>Math.max(r.income,r.expense)));
  const n=yms.length, W=m?(n<=6?340:400):720, H=m?190:200, fs=m?11:10, top=22, bot=26, left=6, right=6, ch=H-top-bot, gw=(W-left-right)/n;
  const label = ym => { const mm=+ym.slice(5); return m&&n>6 ? String(mm) : `${mm}월`; };
  let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="월별 수입과 소비 지출">`;
  [0,.5,1].forEach(f=>{ const yy=top+ch*(1-f); svg+=`<line x1="${left}" x2="${W-right}" y1="${yy}" y2="${yy}" stroke="var(--line2)"/>`; });
  svg+=`<text x="${W-right}" y="12" text-anchor="end" font-size="${fs}">${max>1?won(max):""}</text>`;
  rows.forEach((r,i)=>{ const x0=left+gw*i+gw/2, bw=Math.min(m?14:12,gw*.28), hi=r.income/max*ch, he=r.expense/max*ch, cur=yms[i]===S.month;
    if(r.income) svg+=`<rect x="${x0-bw-1.5}" y="${top+ch-hi}" width="${bw}" height="${hi}" rx="1.5" fill="var(--bar-in)"><title>${label(yms[i])} 수입 ${won(r.income,1)}</title></rect>`;
    if(r.expense) svg+=`<rect x="${x0+1.5}" y="${top+ch-he}" width="${bw}" height="${he}" rx="1.5" fill="var(--bar-out)"><title>${label(yms[i])} 소비 지출 ${won(r.expense,1)}</title></rect>`;
    if(!r.income&&!r.expense) svg+=`<line x1="${x0-bw}" x2="${x0+bw}" y1="${top+ch}" y2="${top+ch}" stroke="var(--line)" stroke-dasharray="2 2"/>`;
    svg+=`<text x="${x0}" y="${H-7}" text-anchor="middle" font-size="${fs}" ${cur?'style="fill:var(--accent);font-weight:700"':""}>${label(yms[i])}</text>`; });
  return `<div class="chart"><div class="chart-legend"><span><i style="background:var(--bar-in)"></i>수입 <i style="background:var(--bar-out);margin-left:10px"></i>소비 지출</span><span style="color:var(--mute)">${opts.note||"기록된 금액 기준"}</span></div>${svg}</div>`;
}

function sortTx(mode){
  const key=t=>(t.date||(t.month+"-00"))+String(t.created_at||t.createdAt||"");
  if(mode==="date-asc") return (a,b)=>key(a)<key(b)?-1:1;
  if(mode==="amt-desc") return (a,b)=>(b.amount||0)-(a.amount||0);
  if(mode==="amt-asc") return (a,b)=>(a.amount||0)-(b.amount||0);
  return (a,b)=>key(a)<key(b)?1:-1;
}
function filteredTx(){
  const f=S.tf, q=f.q.trim().toLowerCase();
  const base = f.all ? S.tx : txIn(S.month);
  return base.filter(t=>(f.type==="all"||t.type===f.type)&&(!f.cat||t.category===f.cat)&&(!f.tag||(t.tags||[]).includes(f.tag))&&(!f.acc||t.account_id===f.acc||t.to_account_id===f.acc)&&(!f.day||t.date===f.day)&&
    (!q||[t.title,t.memo,t.category,t.sub,accName(t.account_id),accName(t.to_account_id),(t.tags||[]).join(" ")].join(" ").toLowerCase().includes(q))).sort(sortTx(f.sort));
}

  const inc=sum(rows,r=>r.income), exp=sum(rows,r=>r.expense), sv=sum(rows,r=>r.saving+r.invest), months=rows.filter(r=>r.count).length;

async function deleteModal(){
  if(!M.armed){ readModal(); M.armed=true; render(); return; }
  const {kind,id,d}=M;
  if(kind==="group"){ if(expenseCats().some(c=>c.group===id)){ M.armed=false; M.err="카테고리가 남아 있어서 삭제할 수 없어요."; render(); return; } if(groups().length<=1){ M.armed=false; M.err="그룹은 하나 이상 있어야 해요."; render(); return; } }
  M=null; render();
  try{
    if(kind==="tx") await api.del("tx",id);
    if(kind==="acc") await api.del("accounts",id);
    if(kind==="fixed") await api.del("fixed",id);
    if(kind==="plan") await api.del("plans",id);
    if(kind==="cat"){ const s=clone(st()); if(d.ckind==="expense"){ s.expenseCats=s.expenseCats.filter(c=>c.name!==d._old); delete s.baseBudget[d._old]; Object.values(s.monthBudget).forEach(o=>delete o[d._old]); } else s.incomeCats=s.incomeCats.filter(c=>c.name!==d._old); await api.saveSettings(s); }
    if(kind==="group"){ const s=clone(st()); s.groups=s.groups.filter(g=>g.id!==id); await api.saveSettings(s); }
    toast("삭제했어요");
  }catch(e){}
}
function moveIn(arr,idx,dir){ const j=idx+dir; if(j<0||j>=arr.length) return arr; const a=arr.slice(); [a[idx],a[j]]=[a[j],a[idx]]; return a; }

/* =================== CSV =================== */
async function saveCsv(name,header,rows){
  const q=v=>{ let s=String(v??""); if(/^[=+\-@]/.test(s)) s="'"+s; return `"${s.replace(/"/g,'""')}"`; };
  const csv="﻿"+[header,...rows].map(r=>r.map(q).join(",")).join("\r\n");
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1000);
  toast("CSV 파일을 저장했어요");
}

    <div class="btns"><button class="btn pri" type="submit" ${A.busy?"disabled":""}>비밀번호 저장</button></div></form>`;
  } else if(t==="reset"){
    form=`<h1>비밀번호 찾기</h1><p>가입한 이메일로 비밀번호 재설정 링크를 보내드려요.</p>
    <form id="authform" style="margin-top:16px">${fld("이메일",`<input id="a-email" type="email" autocomplete="email" required value="${esc(A.email||"")}">`)}${msg}
    <div class="btns"><button class="btn pri" type="submit" ${A.busy?"disabled":""}>재설정 링크 보내기</button><button class="btn" type="button" data-atab="login">로그인으로 돌아가기</button></div></form>`;
  } else {
    const su=t==="signup";
    form=`<div class="seg" style="margin-bottom:18px"><button type="button" data-atab="login" class="${!su?"on":""}">로그인</button><button type="button" data-atab="signup" class="${su?"on":""}">회원가입</button></div>
    <h1>${su?"가계부 시작하기":"다시 오셨네요"}</h1><p>${su?"가입하면 기본 카테고리가 담긴 빈 가계부가 만들어져요. 카테고리는 전부 내 방식대로 바꿀 수 있고, 내 기록은 나만 볼 수 있어요.":"이메일과 비밀번호로 로그인하세요."}</p>
    <form id="authform" style="margin-top:16px">${fld("이메일",`<input id="a-email" type="email" autocomplete="email" required value="${esc(A.email||"")}">`)}
    ${fld(su?"비밀번호 (8자 이상)":"비밀번호",`<input id="a-pw" type="password" autocomplete="${su?"new-password":"current-password"}" required ${su?'minlength="8"':""}>`)}
    ${su?fld("비밀번호 확인",'<input id="a-pw2" type="password" autocomplete="new-password" required minlength="8">'):""}${msg}
    <div class="btns"><button class="btn pri" type="submit" ${A.busy?"disabled":""}>${A.busy?"잠시만요…":su?"가입하기":"로그인"}</button>
    ${su?"":`<button class="link" type="button" data-atab="reset" style="align-self:center">비밀번호를 잊었어요</button>`}</div></form>`;
  }
  return `<div class="gate"><div class="gate-box">${brand}${form}
  <div style="border-top:1px solid var(--line2);margin-top:20px;padding-top:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><span style="font-size:11.5px;color:var(--mute)">계좌번호·카드번호는 입력받지 않아요.</span><button class="link" id="demo" type="button">저장 없이 둘러보기</button></div></div></div>`;
}
const AUTH_ERR = m => /Invalid login credentials/i.test(m)?"이메일 또는 비밀번호가 맞지 않아요.":/Email not confirmed/i.test(m)?"메일함에서 인증 링크를 먼저 눌러주세요.":/already registered|already exists/i.test(m)?"이미 가입된 이메일이에요. 로그인해 주세요.":/rate limit|too many/i.test(m)?"요청이 너무 많아요. 잠시 후 다시 시도해 주세요.":/should be different|same/i.test(m)?"지금 비밀번호와 다른 비밀번호를 입력해 주세요.":/password/i.test(m)?"비밀번호 조건을 확인해 주세요. (8자 이상)":/email/i.test(m)?"이메일 주소를 확인해 주세요.":"처리하지 못했어요. 잠시 후 다시 시도해 주세요.";
function bindGate(){
  const d=$("#demo"); if(d) d.onclick=startDemo;
  $$("[data-atab]").forEach(b=>b.onclick=()=>{ const em=$("#a-email"); S.auth={tab:b.dataset.atab,msg:"",err:"",email:em?em.value:S.auth.email}; render(); });
  const f=$("#authform"); if(!f) return;
  f.onsubmit=async e=>{
    e.preventDefault(); const A=S.auth; const email=(($("#a-email")||{}).value||"").trim(), pw=($("#a-pw")||{}).value, pw2=($("#a-pw2")||{}).value;
    A.email=email||A.email; A.err=""; A.msg="";
    if((A.tab==="signup"||A.tab==="newpw") && (pw||"").length<8){ A.err="비밀번호는 8자 이상이어야 해요."; render(); return; }
    if((A.tab==="signup"||A.tab==="newpw") && pw!==pw2){ A.err="비밀번호 확인이 일치하지 않아요."; render(); return; }
    if(!sb){ A.err="로그인 모듈을 불러오지 못했어요."; render(); return; }
    A.busy=true; render();
    try{
      const back=location.origin+location.pathname;
      if(A.tab==="login"){ const {error}=await sb.auth.signInWithPassword({email,password:pw}); if(error) throw error; }
      if(A.tab==="signup"){ const {data,error}=await sb.auth.signUp({email,password:pw,options:{emailRedirectTo:back}}); if(error) throw error;
        if(!data.session){ S.auth={tab:"login",email,msg:"인증 메일을 보냈어요. 메일의 링크를 누르면 가입이 끝나요. (스팸함도 확인해 주세요)",err:""}; render(); return; } }
      if(A.tab==="reset"){ const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:back}); if(error) throw error; S.auth={tab:"login",email,msg:"재설정 링크를 보냈어요. 메일을 확인해 주세요.",err:""}; render(); return; }
      if(A.tab==="newpw"){ const {data,error}=await sb.auth.updateUser({password:pw}); if(error) throw error; S.auth={tab:"login",msg:"",err:""}; startSession(data.user); return; }
      A.busy=false;
    }catch(err){ A.busy=false; A.err=AUTH_ERR(err.message||""); render(); }
  };
}

let toastT=null;
function toast(msg){ let el=$(".toast"); if(!el){ el=document.createElement("div"); el.className="toast"; el.setAttribute("role","status"); document.body.appendChild(el);} el.textContent=msg; clearTimeout(toastT); toastT=setTimeout(()=>el.remove(),2600); }

if(location.hash==="#demo") startDemo(); else boot();
</script>
</body>
</html>
